---
# Default values for the generic app chart. Defaults only — per-environment values live in
# the platform repo, so this chart must render for any environment and name no registry.
#
# No GitOps-controller or secrets-operator coupling: nothing here assumes ArgoCD or an
# external-secrets operator. The chart never templates a secret value; secrets arrive by
# reference to an existing Secret (`envFrom.secret`), and whatever applies the release is the
# platform repo's business, not the chart's.
#
# It DOES ship optional CRD-backed resources, all off by default: `gatewayApi` renders a
# Gateway API HTTPRoute (`gateway.networking.k8s.io/v1`) and `serviceMonitor` a
# Prometheus-Operator ServiceMonitor. Off means absent, not degraded — but enabling either
# adds a cluster prerequisite, and a release that templates a kind whose CRD is missing fails
# at apply time, not at lint time. Check the CRD exists before flipping the flag.

replicaCount: 1

image:
  # Template: CI publishes ghcr.io/<owner>/<repo>. Set repository to that.
  repository: ghcr.io/OWNER/REPO
  tag: ""            # empty ⇒ chart appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The command the container runs. Default: serve the HTTP service.
command: ["app-serve"]
args: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

# The uid/gid the image was built with (deploy/Dockerfile creates 10000:10000). These are
# values because they are a FACT ABOUT THE IMAGE, and an adopter's image may differ.
#
# The hardening around them is NOT a value — runAsNonRoot, readOnlyRootFilesystem,
# allowPrivilegeEscalation, capabilities.drop and seccompProfile are fixed in
# templates/deployment.yaml. Exposing them would let one line in one environment's bundle
# weaken the whole set, in a repo where nobody reviews security posture. A workload that
# genuinely cannot comply is a decision for docs/architecture.md, not a values override.
runtimeUser:
  uid: 10000
  gid: 10000
  fsGroup: 10000

# The budget SIGTERM handling gets before Kubernetes SIGKILLs the container: stop intake,
# finish in-flight work, exit. Too short and graceful shutdown is a fiction.
terminationGracePeriodSeconds: 30

containerPort: 8080

env:
  APP_HOST: "0.0.0.0"
  APP_PORT: "8080"

envFrom:
  # Namespace-wide configuration the platform provides (broker endpoints, database hosts),
  # referenced by name only. Rendered with `optional: true`: a ConfigMap that has not been
  # created in this namespace yet otherwise wedges the pod in CreateContainerConfigError,
  # which names no cause.
  configMaps: []
  #  - platform-config
  # This service's own secret, created out-of-band. The chart never templates a secret
  # VALUE — a rendered secret ends up in the release manifest, in cluster state, and in
  # every `helm get values` output.
  secret:
    enabled: false
    name: ""

# The sample app serves GET /health and GET /metrics (src/app/server.py). All three probes
# are rendered on purpose: startup guards the boot, readiness withdraws traffic, liveness
# kills the container. With only the last two, the only way to survive a slow boot is a long
# liveness initialDelaySeconds — which then delays detection of a real hang forever after.
livenessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20
readinessProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
startupProbe:
  enabled: true
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 3

# Optional persistent data volume (off by default — the sample is stateless).
# For advanced needs (e.g. a large read-only cache kept out of the image) use extraVolumes.
persistence:
  enabled: false
  storageClass: ""
  accessModes: ["ReadWriteOnce"]
  size: 1Gi
  mountPath: /data
  annotations: {}

service:
  enabled: true
  type: ClusterIP
  port: 80
  annotations: {}
  labels: {}

# Routing via the Gateway API (HTTPRoute) — the modern standard, preferred over Ingress.
# Attach to an existing Gateway (set parentRefs); no controller-specific annotations needed.
gatewayApi:
  enabled: false
  # No default, and rendering FAILS when the route is enabled without one: an HTTPRoute with
  # no parentRef is accepted by the API server and then silently routes nothing — it sits at
  # Accepted=False with no event on the Deployment. Only the platform's per-environment
  # values know which Gateway (and which listener) exists in that cluster.
  parentRefs: []
  #  - name: shared-gateway
  #    namespace: networking   # omit for the same namespace
  #    sectionName: https      # the listener name
  hostnames: []         # e.g. [app.example.com]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendPort: 80   # Service port; defaults to service.port

# Prometheus Operator scrape. `path` MUST be a path the service actually serves (the sample
# serves /metrics — see src/app/server.py); a ServiceMonitor pointing at a 404 is a scrape
# target that fails silently, and the first symptom is an empty panel nobody can explain.
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  labels: {}

# When this is on, `replicaCount` above stops being the source of truth — the HPA owns the
# replica count and a chart that keeps setting both fights itself on every reconcile.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Enable for anything running more than one replica: without a budget a node drain can evict
# every replica at once — a voluntary, entirely avoidable outage.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# Requests AND limits, always. `resources: {}` is not acceptable on a shared cluster: with no
# request the scheduler treats the pod as free and packs nodes until something is OOM-killed;
# with no limit one leaking pod evicts its neighbours. These numbers are a starting point to
# be measured and adjusted per service, not a permanent guess.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

extraVolumes: []
extraVolumeMounts: []
