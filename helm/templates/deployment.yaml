apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/env: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      # THE HARDENING BELOW IS NOT A VALUES KNOB, ON PURPOSE — only the uid/gid are, because
      # those are a fact about the image. runAsNonRoot makes the kubelet REFUSE to start an
      # image that resolves to uid 0, which survives a bad rebuild of the Dockerfile;
      # seccompProfile RuntimeDefault narrows the syscall surface.
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runtimeUser.uid }}
        runAsGroup: {{ .Values.runtimeUser.gid }}
        fsGroup: {{ .Values.runtimeUser.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # `drop: [ALL]` rather than a list of named capabilities, so a capability added to
          # a future default set is dropped too.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ .Values.runtimeUser.uid }}
            runAsGroup: {{ .Values.runtimeUser.gid }}
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            # From the CHART, because the chart is the only thing that knows the released
            # SemVer (CI writes it into appVersion at package time) — the image cannot know
            # its own tag. /health and /metrics both report it. A container `env` entry wins
            # over anything of the same name in `envFrom`, so this cannot be shadowed.
            - name: APP_VERSION
              value: {{ .Chart.AppVersion | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "app.fullname" . }}-env
            {{- range .Values.envFrom.configMaps }}
            - configMapRef:
                name: {{ . }}
                optional: true
            {{- end }}
            {{- if .Values.envFrom.secret.enabled }}
            - secretRef:
                name: {{ .Values.envFrom.secret.name | default (printf "%s-secrets" (include "app.fullname" .)) }}
                optional: true
            {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- omit .Values.livenessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- omit .Values.readinessProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- omit .Values.startupProbe "enabled" | toYaml | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/app
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "app.fullname" . }}-data
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
