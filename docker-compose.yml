# Local run of the sample app — the same image CI builds.
# `docker compose up` builds it and serves http://localhost:8080/health.

services:
  app:
    build: .
    image: ghcr.io/OWNER/REPO:latest   # template: CI overrides this; OWNER/REPO auto-derived
    ports:
      - "8080:8080"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
