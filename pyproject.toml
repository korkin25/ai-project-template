[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Template: rename "app" everywhere to your package/dist name.
name = "app"
# Version is NOT hardcoded here. `release.yml` injects it from GitVersion at publish
# time (`hatch version <semver>`), so the single source is GitVersion (see GitVersion.yml).
dynamic = ["version"]
description = "Sample service for the ai-project-template (replace me)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "you" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "build",
]

[project.scripts]
app = "app.cli:main"
app-serve = "app.server:run"

# Dynamic version source: hatch reads `__version__` from this file, and `release.yml`
# writes the GitVersion number into it at publish time (`hatch version <semver>`).
[tool.hatch.version]
path = "src/app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is measured on every run, not only in CI. A threshold nobody sees until the
# pipeline fails gets worked around; one that fails on the developer's machine gets fixed.
addopts = "-q --cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["src/app"]

[tool.coverage.report]
show_missing = true
# The floor is a RATCHET, not a target. It sits just under the current number so an ordinary
# refactor does not fail the build, and it moves UP as coverage rises — never down to
# accommodate a gap. Lowering it is a decision that belongs in CHANGELOG.md with a reason.
#
# History, so the number is not mistaken for arbitrary: this repo sat at 47% with `cli.py`
# entirely untested, which is precisely why no honest threshold could be set — any value that
# passed would have been chosen to accommodate the hole. Tests first, then the gate.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    # `if __name__ == "__main__":` cannot execute under pytest, so counting it as a miss
    # penalises every module that has an entry point and teaches people to delete the guard.
    'if __name__ == "__main__":',
    # An abstract method's body is a contract, not behaviour; there is nothing to exercise.
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
ignore_missing_imports = true

[tool.bandit]
# The sample service binds all interfaces by default (0.0.0.0); exposure is
# controlled by the container/k8s, not the process. See src/app/server.py.
skips = ["B104"]
