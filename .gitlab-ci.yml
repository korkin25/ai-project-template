---
# GitLab CI for a GitLab mirror of this repo.
#
# The whole pipeline comes from the shared templates listed in `include:` below —
# versioning, language gates, SAST, image build, chart packaging and the functional smoke
# test. There is no umbrella include: the file list IS the composition. Every job
# self-activates from the repo contents (Python jobs need pyproject.toml, docker jobs need
# ${DOCKERFILE}, helm needs ${CHART_PATH}/Chart.yaml), so there is nothing language-specific
# to list here.
#
# Shared CI logic belongs in the templates repo, never in this file. The two local jobs at
# the bottom are a deliberate, argued exception — see the comment above them.
#
# Required project/group CI/CD variables: CI_REGISTRY, CI_REGISTRY_USER, CI_REGISTRY_PASSWORD.
# Pin `ref` to a tag once you adopt this, for reproducible pipelines.

include:
  - project: "open_ci_cd/templates"
    ref: "main"
    file:
      - /globals.yml            # stages, runner tags, shared variables
      - /auto-semversioning.yml # GitVersion -> GitVersion_SemVer
      - /lint.yml               # language gates; each self-activates on its marker files
      - /sast.yml               # checkov, trivy, gitleaks, semgrep, bandit, pip-audit, hadolint
      - /docker-build.yml       # image -> GitLab Container Registry
      - /helm-package.yml       # chart -> GitLab Package Registry (OCI)
      - /functional.yml         # runs this repo's auto-tests/group-a/*.sh

variables:
  # No DOCKERFILE or CHART_PATH override, deliberately. This repo now uses the canonical
  # layout its own service profile declares — deploy/Dockerfile and helm/ — which is exactly
  # what globals.yml already defaults to, so the two overrides that used to sit here became
  # noise restating a default. Every override is a line a reader has to check against upstream
  # before trusting it; the best CI file is the one with nothing in it.

  # The Python package lives in src/ — point the linters, complexity gate and bandit at it.
  PYTHON_LINT_PATHS: "src"
  BANDIT_TARGET: "src"

  # Functional smoke test: discovery needs nothing. /functional.yml finds
  # auto-tests/group-a/*.sh via FUNCTIONAL_TESTS_DIR/FUNCTIONAL_TESTS_GLOB, both already
  # defaulted to this layout in globals.yml, and the port lives in the script itself
  # (validate-deploy.sh reads APP_PORT, default 8080).
  #
  # The runner image DOES need one addition. It is `docker:*`, which ships neither curl nor
  # wget, and the default package list is just `bash`. Without curl the health probe fails
  # every iteration for thirty seconds and looks exactly like a service that never started —
  # which is how it was first diagnosed here, wrongly, as a networking problem. The script now
  # also refuses to run when no probe tool is present, so this variable and that check are
  # belt and braces on the same silent failure.
  FUNCTIONAL_RUNNER_PACKAGES: "bash curl"

  # Runner: globals.yml defaults to GitLab.com shared runners. Uncomment to use a private
  # fleet — the value must be a literal tag, never a reference to another variable.
  # RUNNER_TAG: "open_ci_cd_runner"
  # RUNNER_TAG_INFRA: "open_ci_cd_runner"

# =============================================================================
# Repo-local gates — the exception to "shared CI logic belongs in the templates repo".
#
# Both jobs enforce a rule CLAUDE.md states as mechanically enforced, and both are local
# by nature rather than by convenience:
#
#   * they validate THIS repository's own files (a generated CLAUDE.md, this repo's docs),
#     so there is no shared logic to donate upstream — a template job would need every
#     path and file name passed in as a variable to say anything at all;
#   * they need nothing but bash, coreutils and git, so the usual reason to centralise
#     (pinned tool images, registry credentials, cache tuning) does not apply;
#   * the shared templates repo is off-limits for this change, and a rule that CLAUDE.md
#     advertises as enforced while nothing runs it is worse than no rule: it teaches every
#     reader that the standard is advisory.
#
# If these ever grow a second consumer, they move to the templates repo as-is — that is the
# signal to promote them, not this file growing more jobs.
# =============================================================================

# Standard-drift guard (CLAUDE.md "Standard-drift is enforced").
#
# CLAUDE.md is GENERATED by ./standard/compose.sh from standard/base.md +
# standard/profiles/<profile>.md + standard/repo.env. It drifts two ways: someone edits the
# generated file (the edit dies at the next regenerate and never reaches the other repos),
# or someone edits the sources and forgets to regenerate (every agent then reads the OLD
# rulebook). Either way the group runs two standards and neither is authoritative.
standard-drift:
  stage: validate
  # The image the shared templates already use for their bash+git jobs (commit_changes,
  # helm-package), so this adds no new pin to maintain. Nothing is installed at job time
  # and nothing is fetched: the gate is pure bash + coreutils and works with no network.
  image:
    name: ${IAC_BUNDLE_IMAGE}
    entrypoint: [""]
  extends:
    - .default_runner
  # Independent of every other job — report the drift in the first seconds of the pipeline,
  # not after the image build.
  needs: []
  rules:
    # No branch pipeline while an MR is open for that branch: the MR pipeline covers the
    # same commit, and without this guard every push runs the gate twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always
  script:
    - |
      set -u
      # compose.sh --check prints the full diff (committed vs regenerated) before it exits,
      # so the fix is readable straight from the job log.
      rc=0
      ./standard/compose.sh --check || rc=$?
      case "$rc" in
        0) ;;
        2)
          echo "ERROR: CLAUDE.md has drifted from standard/ (diff above)."
          echo "ERROR: Edit standard/base.md or standard/profiles/<profile>.md — never CLAUDE.md"
          echo "ERROR: itself — then run ./standard/compose.sh and commit the regenerated file."
          exit 1
          ;;
        *)
          echo "ERROR: compose.sh could not run (exit ${rc}). This is a configuration error,"
          echo "ERROR: not drift: standard/repo.env is missing, incomplete, or names a profile"
          echo "ERROR: that has no standard/profiles/<profile>.md."
          exit 1
          ;;
      esac

# Doc-sync guard (CLAUDE.md "Documentation sync" rule) — the GitLab twin of
# .github/workflows/doc-sync.yml. Keep the two in step: they must agree on the patterns and
# on the escape hatches, or the same change passes on one host and fails on the other.
#
# Fails an MR that changes the code/deploy/standard surface without touching any
# documentation. This catches the common failure mode where an agent updates code but
# forgets the docs/CHANGELOG/TODO. Agent-agnostic — it works no matter which tool wrote it.
#
# Escape hatch: label the MR "no-docs", or put "[skip doc-sync]" in the MR title, for the
# rare change that genuinely needs no doc update.
doc-sync:
  stage: validate
  image:
    name: ${IAC_BUNDLE_IMAGE}
    entrypoint: [""]
  extends:
    - .default_runner
  needs: []
  variables:
    # The diff base is an ordinary commit in the target branch's history, which a shallow
    # clone does not contain — with the default depth `git diff` fails with "bad object".
    GIT_DEPTH: "0"
  rules:
    # MR-scoped by construction: "did this change touch docs" is only a meaningful question
    # against a review target. On a branch push there is nothing to diff against.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      set -u
      case "${CI_MERGE_REQUEST_TITLE:-}" in
        *"[skip doc-sync]"*) echo "skip via title"; exit 0 ;;
      esac
      # CI_MERGE_REQUEST_LABELS is comma-separated; spaces are stripped so " no-docs" from a
      # hand-typed label list still matches. "dependencies" is the label Renovate is
      # configured to add — a lockfile bump legitimately carries no doc change. There is no
      # actor check like the GitHub side's dependabot one: the Renovate bot's username is
      # per-installation, so the label is the only portable hook.
      labels=",$(printf '%s' "${CI_MERGE_REQUEST_LABELS:-}" | tr -d ' '),"
      case "$labels" in
        *",no-docs,"* | *",dependencies,"*) echo "skip via label"; exit 0 ;;
      esac

      # GitLab hands MR pipelines the merge base as CI_MERGE_REQUEST_DIFF_BASE_SHA. The
      # fallback exists only for the case where it is absent (an older GitLab, or a pipeline
      # shape that does not populate it) — recomputing it by hand when GitLab already knows
      # it is how the two sides end up disagreeing about what "changed" means.
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$base" ]; then
        target="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:?no MR target branch}"
        git fetch --quiet origin "$target"
        base="$(git merge-base FETCH_HEAD HEAD)"
      fi

      changed="$(git diff --name-only "$base" HEAD)"
      echo "changed files:"; echo "$changed"

      # Keep these two patterns identical to .github/workflows/doc-sync.yml. Code side =
      # everything a reader of the docs could be misled about; `standard/` is in it because
      # the standard IS the product here. Patterns are anchored (^), so
      # templates/infra/README.md counts as code — it is a file this repo ships to other
      # repos, not documentation of this repo. Doc side includes AUTOPILOT-LOG.md, which
      # CLAUDE.md makes mandatory for an autonomous change of any substance.
      code="$(echo "$changed" | grep -E '^(src/|chart/|helm/|deploy/|standard/|skills/|templates/|auto-tests/|Dockerfile|docker-compose|\.github/workflows/|\.gitlab-ci\.yml)' || true)"
      docs="$(echo "$changed" | grep -E '^(docs/|README\.md|CHANGELOG\.md|TODO\.md|CLAUDE\.md|AUTOPILOT-LOG\.md)' || true)"

      if [ -n "$code" ] && [ -z "$docs" ]; then
        echo "ERROR: Code/deploy/standard files changed but no docs updated. Update the matching"
        echo "ERROR: doc per CLAUDE.md 'Documentation sync' (CHANGELOG/docs/tests.md/Features/TODO),"
        echo "ERROR: or add the 'no-docs' label / '[skip doc-sync]' in the MR title if truly N/A."
        exit 1
      fi
      echo "doc-sync OK"
