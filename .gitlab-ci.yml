---
# GitLab CI — mirror of .github/workflows/ci.yml for a GitLab mirror of this repo.
#
# It reuses the shared GitLab CI templates (open_ci_cd/templates) for image build,
# Helm packaging, SAST and auto-semversioning (which reads the repo's GitVersion.yml —
# shipped, not the CI's minimal fallback), and adds the Python-specific gates
# (ruff/mypy/pytest, radon/xenon, bandit/pip-audit/semgrep) that those .NET-oriented
# templates don't provide. Artifacts go to GitLab's own storage:
#   - Docker image  → GitLab Container Registry (default_build)
#   - Helm chart    → GitLab Package Registry, OCI (default_helm_package)
#
# Required project/group CI/CD variables: CI_REGISTRY, CI_REGISTRY_USER,
# CI_REGISTRY_PASSWORD (see the templates' globals.yml). Pin `ref` to a tag for
# reproducibility once you adopt this.

include:
  - project: "open_ci_cd/templates"
    ref: "main"
    file:
      - /globals.yml
      - /auto-semversioning.yml
      - /docker-build.yml      # default_build → image → Container Registry (+ trivy image scan)
      - /helm-package.yml      # default_helm_package → chart → Package Registry (OCI)
      - /sast.yml              # checkov + trivy + gitleaks

variables:
  # This repo keeps the Dockerfile at the root and the chart under chart/.
  DOCKERFILE: "Dockerfile"
  CHART_PATH: "chart"
  # Python cache
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"

# Runner tags for this pipeline. Defaults to GitLab.com shared (public) runners; replace
# with your own private runner tag(s) if you have one.
.default_runner:
  tags:
    - saas-linux-small-amd64

# Python jobs run on branch pushes, merge requests, and tags — and only when this is a
# Python project (pyproject.toml present), so they skip cleanly on other languages.
.py_rules:
  rules:
    - if: $CI_COMMIT_TAG
      exists: [pyproject.toml]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: [pyproject.toml]
    - if: $CI_COMMIT_BRANCH
      exists: [pyproject.toml]

.python:
  image: python:3.12-slim
  extends: [.default_runner]
  cache:
    key: "py-${CI_COMMIT_REF_SLUG}"
    paths: [".cache/pip"]

# ---- lint + type + tests (matrix 3.11 / 3.12) -------------------------------
python-lint-test:
  extends: [.python, .py_rules]
  stage: test
  parallel:
    matrix:
      - PYVER: ["3.11", "3.12"]
  image: python:${PYVER}-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - ruff check .
    - mypy
    - pytest

# ---- code quality (radon / xenon) -------------------------------------------
python-quality:
  extends: [.python, .py_rules]
  stage: test
  script:
    - pip install radon xenon
    - radon cc -s -a src
    - radon mi -s src
    - xenon --max-absolute C --max-modules B --max-average A src || true

# ---- security: bandit + pip-audit (clean env) -------------------------------
python-security:
  extends: [.python, .py_rules]
  stage: sast
  rules:
    - if: $SAST_DISABLED == "true"
      when: never
    - !reference [.py_rules, rules]
  script:
    - pip install -e .
    - pip install bandit pip-audit
    - bandit -c pyproject.toml -r src
    - pip-audit

# ---- security: semgrep (SAST), report mode ----------------------------------
python-semgrep:
  extends: [.python, .py_rules]
  stage: sast
  allow_failure: true
  rules:
    - if: $SAST_DISABLED == "true"
      when: never
    - !reference [.py_rules, rules]
  script:
    - pip install semgrep
    - semgrep scan --config p/python --config p/security-audit --error --skip-unknown-extensions

# ---- functional: boot the built image and probe /health ---------------------
# IMAGE_REF is propagated from default_build's dotenv (image.env) via `needs`.
python-functional:
  extends: [.default_runner, .docker_buildx_job]
  stage: image_scan
  needs:
    - job: default_build
      artifacts: true
      optional: true
  rules:
    - !reference [.docker_build_rules, rules]
  script:
    - !reference [.check_docker_registry_vars]
    - !reference [.docker_registry_login]
    - |
      set -euo pipefail
      : "${IMAGE_REF:?IMAGE_REF not set — needs default_build}"
      echo "INFO: probing ${IMAGE_REF}"
      docker pull "${IMAGE_REF}"
      docker run -d --name app -p 8080:8080 "${IMAGE_REF}"
      ok=0
      for _ in $(seq 1 20); do
        if wget -qO- "http://docker:8080/health" >/dev/null 2>&1; then ok=1; break; fi
        sleep 1
      done
      docker logs app | tail -15 || true
      docker rm -f app >/dev/null 2>&1 || true
      test "$ok" = "1"
