---
# CI/CD for @@PROJECT@@ — profile: service.
#
# WHY THIS FILE IS ALMOST EMPTY.
# The pipeline is a COMPOSITION of the shared templates in `@@CI_TEMPLATES_PROJECT@@`, never a
# set of inline jobs. Every job in this pipeline arrives through an include; this file only
# declares *which* templates apply, *what* this repo is called, and *where* its jobs run.
# New shared CI logic belongs in the templates repo, so every repo gets it at once — a job
# written here is a private fork of the standard that nobody else benefits from and nobody
# else fixes when it rots.
#
# What the composition buys (see standard/profiles/service.md):
#   /globals.yml             stages, runner-tag anchors, DOCKERFILE/CHART_PATH defaults,
#                            change-detection rules, scanner image pins
#   /auto-semversioning.yml  get_unique_semversion -> GitVersion_SemVer for the whole pipeline
#   /lint.yml                language gates, self-activating on marker files; Python =>
#                            ruff + mypy + pytest over 3.11/3.12, plus radon/xenon
#   /sast.yml                checkov, trivy, gitleaks, semgrep, bandit, pip-audit, hadolint
#   /docker-build.yml        build + push + cosign signature + SBOM; writes
#                            .versions/docker-image.env
#   /helm-package.yml        packages helm/ at the SAME SemVer, pushes to OCI; writes
#                            .versions/helm-chart.env
#   /functional.yml          runs auto-tests/group-a/*.sh against the built image
#   /commit_changes.yml      commits the .versions/*.env files back with [skip ci]
#
# NOT included, deliberately:
#   /docker-sign.yml         DEPRECATED. Signing already happens inside docker-build.yml
#                            (default_sign). Including it signs the image a second time and
#                            races the first signature. Do not "restore" it.
#
# This pipeline never deploys. It publishes an image and a chart; releasing them into an
# environment is a separate, reviewed MR in the platform repo that bumps `chartVersion` in
# that environment's bundle.yaml. A service pipeline that runs `kubectl apply` has taken
# over a decision it cannot make consistently across environments.
include:
  - project: "@@CI_TEMPLATES_PROJECT@@"
    # WHAT THIS REF COSTS YOU.
    # These templates are executed code from another repository: whatever `ref` points at
    # runs with this project's CI_JOB_TOKEN, its registry credentials and its signing key.
    # A tag makes builds reproducible and turns a template upgrade into a reviewed, per-repo
    # act. A moving branch does the opposite — one upstream commit changes every repo's
    # pipeline at once, with no MR and no way to reproduce yesterday's build.
    #
    # So pin a TAG, and before pinning check that the tag actually contains every file in
    # the list below — a tag that trails the default branch is usually missing some of them,
    # and the pipeline fails with "file not found" rather than with anything explanatory.
    # If no such tag exists yet, tracking the default branch is a deliberate, temporary
    # trade: record HERE which branch, why, and what has to become true to move to a tag.
    # An undocumented moving ref is indistinguishable from an oversight, and nobody dares
    # touch it afterwards.
    ref: "@@CI_TEMPLATES_REF@@"
    file:
      - "/globals.yml"
      - "/auto-semversioning.yml"
      - "/lint.yml"
      - "/sast.yml"
      - "/docker-build.yml"
      - "/helm-package.yml"
      - "/functional.yml"
      - "/commit_changes.yml"

variables:
  # The image name and the chart name are pinned to the canonical hyphenated project name
  # rather than left to default to ${CI_PROJECT_NAME}. Renaming or transferring the GitLab
  # project would otherwise silently start publishing a *different* image and a *different*
  # chart, and every platform bundle pinning the old name would keep deploying the last
  # build forever without a single error.
  MODULE_NAME: "@@PROJECT@@"
  HELM_REPOSITORY: "@@PROJECT@@"

  # DOCKERFILE and CHART_PATH are deliberately NOT set here. This repo uses the canonical
  # layout (deploy/Dockerfile + helm/), which is exactly what globals.yml already defaults
  # to. An override that restates the default is a landmine: it survives a change of the
  # shared default and quietly puts this repo on its own path. A repo that genuinely
  # deviates sets them AND explains why in docs/architecture.md.

  # Lint/type-check only what this repo authors. The shared default is "." which also drags
  # in generated and vendored trees; naming the two real source roots keeps ruff/mypy fast
  # and their findings actionable.
  PYTHON_LINT_PATHS: "src tests"

  # functional.yml runs the group-(a) scripts inside docker:${DOCKER_VERSION} (Alpine — it
  # must ship the docker CLI to drive the DinD service). That image has no bash and no curl,
  # so the job apk-adds this list first. auto-tests/group-a/validate-deploy.sh needs both.
  FUNCTIONAL_RUNNER_PACKAGES: "bash curl"

  # Mounts the authenticated GitLab PyPI index into `docker build` as a BuildKit secret, so
  # the image can resolve group-internal packages without the token ever landing in an image
  # layer or in `docker history`. Harmless when PIP_EXTRA_INDEX_URL is unset: the template
  # skips empty mappings and deploy/Dockerfile treats a missing secret as "no extra index".
  DOCKERBUILD_SECRET_pip_index: "PIP_EXTRA_INDEX_URL"

# ---------------------------------------------------------------------------------------
# Runner tags — READ THIS BEFORE "CLEANING UP" THE FOUR BLOCKS BELOW
# ---------------------------------------------------------------------------------------
# globals.yml tags jobs through two anchors, `.default_runner` and `.default_runner_infra`,
# whose value comes from ${RUNNER_TAG} / ${RUNNER_TAG_INFRA} (default:
# `saas-linux-small-amd64`, i.e. GitLab.com's shared SaaS runners). Overriding the two
# anchors here retargets every job that EXTENDS them onto our own fleet. The main file wins
# over an include and the anchors carry nothing but `tags`, so the override is complete.
#
# The subtle part: TWO JOBS NEVER EXTEND EITHER ANCHOR and therefore ship with no tags at
# all —
#
#   get_unique_semversion   (auto-semversioning.yml) — a plain job with no `extends:`
#   SBOM-cyclonedx-image    (docker-build.yml)       — extends only
#                                                      .load_image_env_and_resolve + .sbom_rules
#
# An untagged job is eligible for ANY runner the project can see, which in practice means it
# escapes to the SaaS shared runners: it burns paid CI minutes, runs outside our network (so
# it cannot reach an internal registry), or sits in `pending` forever when the project has no
# shared-runner entitlement. Overriding `.default_runner` does NOT reach these two — they
# never extend it — which is exactly why this looks redundant and is not.
#
# The shared templates are not ours to patch, and a per-job `tags:` in the main file wins
# over the include, so overriding both jobs BY NAME here is the correct and complete fix.
# Deleting either block because "the anchors already handle it" reintroduces the bug, and it
# is invisible until someone reads the runner column of a green pipeline.
#
# The tag must be a LITERAL. GitLab expands variables in `tags`, but not nested references
# (gitlab-org/gitlab#407129): `tags: [$RUNNER_TAG]` where RUNNER_TAG itself holds `$OTHER`
# yields the literal string as a tag and the job hangs in `pending` with no matching runner.
# Substitute `@@RUNNER_TAG@@` with the literal tag of the runner fleet your infra repo
# registered, in all four blocks below — they must stay in sync. Keep it QUOTED while it is
# still a token: a plain YAML scalar may not begin with `@`, and the parser reports that as
# a syntax error somewhere else in the file.
.default_runner:
  tags:
    - "@@RUNNER_TAG@@"

.default_runner_infra:
  tags:
    - "@@RUNNER_TAG@@"

get_unique_semversion:
  tags:
    - "@@RUNNER_TAG@@"

SBOM-cyclonedx-image:
  tags:
    - "@@RUNNER_TAG@@"

# Project-specific jobs (migrations, extra gates) go below. Think twice: if the job would be
# useful to a second repo, it belongs in @@CI_TEMPLATES_PROJECT@@ instead.

# =========================================================================================
# Repo-local gates — the argued exception to the rule stated directly above.
#
# Both jobs enforce a rule the generated CLAUDE.md states as MECHANICALLY ENFORCED ("Doc-sync
# is enforced", "Standard-drift is enforced"). They are local by nature, not by convenience:
#
#   * they validate THIS repository's own files — the CLAUDE.md generated here, this repo's
#     own docs — so there is no shared logic to donate upstream. A template job would need
#     every path and file name passed in as a variable before it could say anything at all,
#     and a "shared" job configured entirely per-repo is a copy with extra steps.
#   * they need nothing but bash, coreutils and git, so the usual reasons to centralise
#     (pinned tool images, registry credentials, cache tuning) do not apply.
#   * a rule advertised as enforced while nothing runs it is worse than no rule: it teaches
#     every reader that the standard is advisory, and the next rule is believed even less.
#
# If a second repo ever needs these VERBATIM, that is the signal to move them into
# @@CI_TEMPLATES_PROJECT@@ unchanged — not the signal to grow more local jobs here.
# =========================================================================================

# Standard-drift guard (CLAUDE.md "Standard-drift is enforced").
#
# CLAUDE.md is GENERATED by ./standard/compose.sh from standard/base.md +
# standard/profiles/service.md + standard/repo.env. It drifts two ways: someone edits the
# generated file (the edit dies at the next regenerate and never reaches the other repos), or
# someone edits the sources and forgets to regenerate (every agent then reads the OLD
# rulebook). Either way the group runs two standards and neither is authoritative.
#
# `standard/` is VENDORED, not referenced: compose.sh, base.md and profiles/ are copied in
# when this scaffold is instantiated, and only repo.env is filled in per repo. A missing
# ./standard/compose.sh means the repo was created by copying files by hand rather than from
# the template — fix the copy, do not delete this job.
standard-drift:
  stage: validate
  # The image the shared templates already use for their bash+git jobs (commit_changes,
  # helm-package), so this adds no new pin to maintain. Nothing is installed at job time and
  # nothing is fetched: the gate is pure bash + coreutils and works with no network.
  image:
    name: "${IAC_BUNDLE_IMAGE}"
    entrypoint: [""]
  extends:
    - .default_runner
  # Independent of every other job — report the drift in the first seconds of the pipeline,
  # not after the image build.
  needs: []
  rules:
    # No branch pipeline while an MR is open for that branch: the MR pipeline covers the same
    # commit, and without this guard every push runs the gate twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always
  script:
    - |
      set -u
      # compose.sh --check prints the full diff (committed vs regenerated) before it exits,
      # so the fix is readable straight from the job log.
      rc=0
      ./standard/compose.sh --check || rc=$?
      case "$rc" in
        0) ;;
        2)
          echo "ERROR: CLAUDE.md has drifted from standard/ (diff above)."
          echo "ERROR: Edit standard/base.md or standard/profiles/<profile>.md — never CLAUDE.md"
          echo "ERROR: itself — then run ./standard/compose.sh and commit the regenerated file."
          exit 1
          ;;
        *)
          echo "ERROR: compose.sh could not run (exit ${rc}). This is a configuration error,"
          echo "ERROR: not drift: standard/repo.env is missing, incomplete, or names a profile"
          echo "ERROR: that has no standard/profiles/<profile>.md."
          exit 1
          ;;
      esac

# Doc-sync guard (CLAUDE.md "Documentation sync" rule).
#
# Fails an MR that changes the code/deploy surface without touching any documentation. This
# catches the common failure mode where an agent updates code but forgets the
# docs/CHANGELOG/TODO. Agent-agnostic — it works no matter which tool wrote the diff.
#
# Escape hatch: label the MR "no-docs", or put "[skip doc-sync]" in the MR title, for the rare
# change that genuinely needs no doc update.
#
# This repo supports exactly ONE CI host (standard/profiles/service.md, "Choosing a host").
# If you ever add a GitHub pipeline alongside this one, it needs both gates with the SAME
# patterns and the SAME escape hatches — otherwise the identical change passes on one host and
# fails on the other, and people learn to re-run the red one until it turns green.
doc-sync:
  stage: validate
  image:
    name: "${IAC_BUNDLE_IMAGE}"
    entrypoint: [""]
  extends:
    - .default_runner
  needs: []
  variables:
    # The diff base is an ordinary commit in the target branch's history, which a shallow
    # clone does not contain — with the default depth `git diff` fails with "bad object".
    GIT_DEPTH: "0"
  rules:
    # MR-scoped by construction: "did this change touch docs" is only a meaningful question
    # against a review target. On a branch push there is nothing to diff against.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      set -u
      case "${CI_MERGE_REQUEST_TITLE:-}" in
        *"[skip doc-sync]"*) echo "skip via title"; exit 0 ;;
      esac
      # CI_MERGE_REQUEST_LABELS is comma-separated; spaces are stripped so " no-docs" from a
      # hand-typed label list still matches. "dependencies" is the label Renovate is
      # configured to add — a lockfile bump legitimately carries no doc change. There is no
      # actor check: the Renovate bot's username is per-installation, so the label is the only
      # portable hook.
      labels=",$(printf '%s' "${CI_MERGE_REQUEST_LABELS:-}" | tr -d ' '),"
      case "$labels" in
        *",no-docs,"* | *",dependencies,"*) echo "skip via label"; exit 0 ;;
      esac

      # GitLab hands MR pipelines the merge base as CI_MERGE_REQUEST_DIFF_BASE_SHA. The
      # fallback exists only for the case where it is absent (an older GitLab, or a pipeline
      # shape that does not populate it) — recomputing it by hand when GitLab already knows it
      # is how two checks end up disagreeing about what "changed" means.
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$base" ]; then
        target="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:?no MR target branch}"
        git fetch --quiet origin "$target"
        base="$(git merge-base FETCH_HEAD HEAD)"
      fi

      changed="$(git diff --name-only "$base" HEAD)"
      echo "changed files:"; echo "$changed"

      # Code side = everything a reader of the docs could be misled about, for THIS profile:
      # the package, the image, the chart, the tier-(a) scripts, the vendored rulebook and the
      # pipeline itself. Patterns are anchored (^) so a path only counts at the repo root.
      #
      # `chart/` is listed beside `helm/` although this scaffold ships `helm/`: the fleet
      # genuinely contains both layouts (a repo that deviates sets CHART_PATH and says why),
      # and a pattern for a directory that does not exist costs nothing, while a missing one is
      # a chart change nobody is asked to document.
      #
      # `tests/` is deliberately OUT. The pytest suite is already gated by the language jobs,
      # docs/tests.md describes the tiers rather than individual cases, and any change that
      # alters behaviour touches src/ in the same commit anyway. Listing it would make every
      # added test demand a doc edit — the fastest way to teach people to reach for the escape
      # hatch by reflex, which costs the gate its meaning on the changes that matter.
      code="$(echo "$changed" | grep -E '^(src/|deploy/|helm/|chart/|auto-tests/|standard/|skills/|Dockerfile|docker-compose|\.github/workflows/|\.gitlab-ci\.yml)' || true)"
      # Doc side includes AUTOPILOT-LOG.md, which CLAUDE.md makes mandatory for an autonomous
      # change of any substance.
      docs="$(echo "$changed" | grep -E '^(docs/|README\.md|CHANGELOG\.md|TODO\.md|CLAUDE\.md|AUTOPILOT-LOG\.md)' || true)"

      if [ -n "$code" ] && [ -z "$docs" ]; then
        echo "ERROR: Code/deploy files changed but no docs updated. Update the matching doc per"
        echo "ERROR: CLAUDE.md 'Documentation sync' (CHANGELOG/docs/tests.md/Features/TODO), or"
        echo "ERROR: add the 'no-docs' label / '[skip doc-sync]' in the MR title if truly N/A."
        exit 1
      fi
      echo "doc-sync OK"
