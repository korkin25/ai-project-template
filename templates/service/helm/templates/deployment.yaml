apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "@@PROJECT@@.fullname" . }}
  labels:
    {{- include "@@PROJECT@@.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "@@PROJECT@@.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "@@PROJECT@@.selectorLabels" . | nindent 8 }}
    spec:
      # THE HARDENING BELOW IS NOT A VALUES KNOB, ON PURPOSE.
      # These settings are the chart's contract with the platform: the image is built to
      # satisfy them (non-root uid 10001, nothing written outside /tmp), the cluster policy
      # enforces them, and checkov gates them. Exposing them as values would let a single
      # environment weaken the whole set with one line in a bundle, in a repo where nobody
      # reviews security posture. A workload that genuinely cannot comply is a design
      # decision (docs/architecture.md), not a values override.

      # Named explicitly, never left to the namespace `default` — see serviceaccount.yaml.
      serviceAccountName: {{ include "@@PROJECT@@.serviceAccountName" . }}
      # This workload never calls the Kubernetes API, so mounting its ServiceAccount token
      # only hands an attacker a credential (CKV_K8S_38).
      automountServiceAccountToken: false

      # Pod-level: runAsNonRoot makes the kubelet REFUSE to start an image that resolves to
      # uid 0 — a defence that survives a bad rebuild of the Dockerfile. The uid/gid match
      # deploy/Dockerfile exactly; fsGroup makes any mounted volume group-writable for it.
      # seccompProfile RuntimeDefault filters the syscall surface (CKV_K8S_23/29/31/40).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The grace period is the budget SIGTERM handling gets (see src/@@PKG@@/main.py):
      # stop intake, finish the in-flight batch, commit. Too short and Kubernetes SIGKILLs
      # mid-batch, which is exactly the message loss the commit-after-success design
      # prevents everywhere else.
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Container-level (CKV_K8S_20/22/28/30/37): no privilege escalation, read-only
          # root filesystem, every capability dropped. `drop: [ALL]` rather than a list of
          # specific capabilities, so a future capability added to the default set is
          # dropped too.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          {{- if .Values.service.enabled }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- end }}
          env:
            # The running process reports this in /health. It comes from the CHART, because
            # the chart is the only place that knows the released SemVer (CI writes it into
            # appVersion at package time) — the image cannot know its own tag.
            - name: APP_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: APP_PORT
              value: {{ .Values.service.port | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # A probe is ALWAYS rendered (CKV_K8S_8/9) — the service profile requires the
          # chart to render an httpGet probe or an exec probe, never neither. With the
          # Service disabled the pod has no port to probe, so liveness falls back to proving
          # the interpreter and the package still load.
          #
          # All three are rendered, and the startup probe comes first for a reason: while it
          # is running, liveness and readiness are suspended, so a slow boot cannot be
          # mistaken for a hang and killed halfway through.
          startupProbe:
            {{- if .Values.service.enabled }}
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            {{- else }}
            exec:
              command: ["python", "-c", "import @@PKG@@; import sys; sys.exit(0)"]
            {{- end }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            {{- if .Values.service.enabled }}
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            {{- else }}
            exec:
              command: ["python", "-c", "import @@PKG@@; import sys; sys.exit(0)"]
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            {{- if .Values.service.enabled }}
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            {{- else }}
            exec:
              command: ["python", "-c", "import @@PKG@@; import sys; sys.exit(0)"]
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The only writable path in the container. Python needs somewhere for temp files
            # and HOME (deploy/Dockerfile sets HOME=/tmp); everything else stays read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          # emptyDir, not a PVC: scratch space must die with the pod. State that has to
          # survive a restart belongs in a database, not in a container filesystem.
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
