{{- if .Values.serviceAccount.create }}
# One ServiceAccount per service, even though this workload needs no Kubernetes API access.
# It is the identity everything else later attaches to — an RBAC RoleBinding, a cloud
# workload-identity annotation, an audit-log filter. Sharing the namespace `default` account
# means the first of those grants is silently granted to every pod in the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "@@PROJECT@@.serviceAccountName" . }}
  labels:
    {{- include "@@PROJECT@@.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Belt and braces with the pod-level setting: a token mounted into a workload that never
# calls the API is only a credential for an attacker to find (CKV_K8S_38).
automountServiceAccountToken: false
{{- end }}
