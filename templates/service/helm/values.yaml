# Defaults for @@PROJECT@@.
#
# THIS FILE CARRIES DEFAULTS ONLY. Per-environment values live in the platform repo
# (clusters/<cluster>/environments/<env>/values/@@PROJECT@@.yaml) and are merged in by the
# HelmRelease. The rule that keeps the two from fighting: this chart must render for ANY
# environment without edits, so nothing here may name a cluster, a domain or a namespace.
#
# The chart never templates a secret VALUE. Secrets arrive by reference (`envFrom.secretRef`)
# to a Secret that already exists in the namespace, provisioned by the secrets operator. A
# secret rendered by a chart ends up in the release manifest, i.e. in cluster state and in
# every `helm get values` output.

replicaCount: 1

image:
  # repository and tag are REWRITTEN by helm-package.yml from the image that this same
  # pipeline built and pushed. A hand-set image tag in a chart is always a bug: it decouples
  # the chart version from the code it deploys, and it is invisible until the wrong build
  # ships. Whatever is written here is only what a local `helm template` shows.
  #
  # @@REGISTRY@@ is a SCAFFOLD PLACEHOLDER, substituted when this template is instantiated —
  # the registry host of the repo being created (`ghcr.io`, `registry.gitlab.com`, a private
  # Harbor). A token rather than a default on purpose: this standard is host-agnostic, and a
  # default naming one host is exactly the sort of value that survives adoption unread and is
  # then discovered in a cluster, as a pull failure against somebody else's registry.
  #
  # Quoted because `@` is a reserved YAML indicator and may not open a plain scalar — the
  # same reason Chart.yaml quotes its name.
  repository: "@@REGISTRY@@/@@GROUP@@/@@PROJECT@@"
  tag: "0.0.0"
  # IfNotPresent, not Always: deployments reference an immutable, CI-produced tag, so
  # re-pulling on every restart buys nothing and costs an outage when the registry is down.
  pullPolicy: IfNotPresent

# The pull secret for @@REGISTRY@@. Provisioned in the namespace by the infra repo and
# referenced here by NAME ONLY — the chart never templates a credential.
#
# @@PULL_SECRET@@ is a scaffold placeholder for the same reason @@REGISTRY@@ is, and it is
# the one that fails least helpfully: the secret's name is chosen by whoever runs the
# cluster, so a wrong default renders perfectly, passes `helm lint`, and surfaces as an
# ImagePullBackOff whose message names the image and never the secret that was missing.
imagePullSecrets:
  - name: "@@PULL_SECRET@@"

nameOverride: ""

# The health server always listens (see src/@@PKG@@/main.py), so a ClusterIP Service is on by
# default: it is what the httpGet probes, the platform's tier-(d) tests and any sibling
# service address. A pure worker that must not be addressable at all sets enabled: false —
# the deployment then falls back to an exec probe.
service:
  enabled: true
  type: ClusterIP
  port: 8080

# The chart creates its own ServiceAccount rather than using the namespace `default`. With
# a dozen services sharing one account, the first service that needs an RBAC role or a cloud
# workload identity grants it to every pod in the namespace, and nothing records that it did.
serviceAccount:
  create: true
  # Extra annotations, e.g. the cloud IAM role a workload identity binds to.
  annotations: {}
  # Empty ⇒ the service's own name. Set only to adopt an account the infra repo owns.
  name: ""

# Prometheus Operator scrape. `path` MUST be one the process actually serves — the worker
# skeleton serves /health and /metrics on the same port (see src/@@PKG@@/main.py), and the
# handler and this flag were added in the same change on purpose. A ServiceMonitor pointing
# at a 404 is a scrape target that fails silently: empty panels, no alert, no explanation.
#
# Off by default because the CRD is a cluster prerequisite, not a given. `enabled: true`
# without monitoring.coreos.com installed fails at APPLY time, which is far from here.
# Enable it per environment from the platform repo's values, where the cluster is known.
serviceMonitor:
  enabled: false
  path: /metrics
  interval: 30s
  # The label the cluster's Prometheus selects ServiceMonitors by — cluster-specific, so no
  # default: a ServiceMonitor the operator does not select is created and then ignored.
  labels: {}

probes:
  path: /health
  # Generous initialDelay + low failureThreshold on readiness, longer on liveness: readiness
  # should react fast (it only removes an endpoint), liveness slowly (it kills a container).
  #
  # The STARTUP probe is what makes those two settings honest. Without it the only way to
  # survive a slow boot is a long liveness initialDelaySeconds, which then delays detection
  # of a real hang for the whole life of the pod. failureThreshold × periodSeconds is the
  # total boot budget; liveness and readiness do not run until it succeeds.
  startup:
    periodSeconds: 3
    failureThreshold: 30
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

# A node drain evicts pods; without a budget it can take every replica of this service at
# once, which is a voluntary outage nobody chose. Enable it for anything above one replica.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # Set one OR the other. maxUnavailable wins when non-empty.
  maxUnavailable: ""

# Gateway API HTTPRoute — NOT an Ingress. Ingress is frozen upstream; Gateway API is the
# supported path for anything new, and the cluster's Gateway is owned by the infra repo.
#
# Disabled by default because MOST SERVICES EXPOSE NOTHING: a worker that is reachable from
# the internet by accident is a security incident, and defaults are what people forget to
# change. Enable it only for a service that genuinely serves external traffic, and set
# parentRefs to the Gateway the platform provides for that environment.
httpRoute:
  enabled: false
  # Required when enabled — the chart fails rendering with a readable message otherwise,
  # because an HTTPRoute with no parentRef is silently ignored by the controller (it stays
  # Accepted=False and nothing routes, with no event on the Deployment).
  parentRefs: []
  #  - name: platform-gateway
  #    namespace: gateway-system
  #    sectionName: https
  hostnames: []
  #  - @@PROJECT@@.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# Non-secret configuration, rendered as plain env vars. Anything sensitive belongs in the
# Secret referenced by envFrom below, never here.
env: {}
#  LOG_LEVEL: INFO

# Shared, namespace-wide configuration (broker endpoints, database hosts) and this service's
# own secret. `optional: true` on both so the pod still starts in an environment where one
# has not been created yet — a missing ConfigMap otherwise blocks the pod with a
# CreateContainerConfigError that names no cause.
envFrom:
  - configMapRef:
      name: platform-config
      optional: true
  - secretRef:
      # Quoted: `@` is a reserved YAML indicator and may not open a plain scalar.
      name: "@@PROJECT@@-secrets"
      optional: true

# Requests AND limits are set. `resources: {}` is not acceptable for a service on a shared
# cluster: with no request the scheduler treats the pod as free and packs nodes until
# something is OOM-killed, and with no limit one leaking pod evicts its neighbours. These
# numbers are a starting point — measure and adjust per service.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
