---
# CI/CD for @@PROJECT@@ — profile: library.
#
# A library builds no image and deploys nothing; its product is an API that other repos pin.
# The pipeline is therefore short by design: version it, prove it still compiles and still
# means what it meant, scan it, and publish it.
#
# Docker and Helm jobs are absent WITHOUT being disabled. Every job in the shared templates
# guards its rules with `exists:` on a marker file (${DOCKERFILE}, ${CHART_PATH}/Chart.yaml);
# this repo has neither, so those jobs are never created. Nothing needs switching off, and
# adding a deploy/Dockerfile here would silently start producing an image — which is the
# signal that the repo has stopped being a library.
include:
  - project: "@@CI_TEMPLATES_PROJECT@@"
    # WHAT THIS REF COSTS YOU.
    # These templates are executed code from another repository: whatever `ref` points at
    # runs with this project's CI_JOB_TOKEN, its registry credentials and its signing key.
    # A tag makes builds reproducible and turns a template upgrade into a reviewed, per-repo
    # act. A moving branch does the opposite — one upstream commit changes every repo's
    # pipeline at once, with no MR and no way to reproduce yesterday's build.
    #
    # So pin a TAG, and before pinning check that the tag actually contains every file in
    # the list below — a tag that trails the default branch is usually missing some of them,
    # and the pipeline fails with "file not found" rather than with anything explanatory.
    # If no such tag exists yet, tracking the default branch is a deliberate, temporary
    # trade: record HERE which branch, why, and what has to become true to move to a tag.
    # An undocumented moving ref is indistinguishable from an oversight, and nobody dares
    # touch it afterwards.
    ref: "@@CI_TEMPLATES_REF@@"
    file:
      - "/globals.yml"           # stages, runner-tag anchors, shared variables
      - "/auto-semversioning.yml" # get_unique_semversion -> GitVersion_SemVer
      - "/lint.yml"              # ruff + mypy + pytest (3.11/3.12) + radon/xenon
      - "/sast.yml"              # gitleaks, semgrep, bandit, pip-audit, checkov, trivy(fs)

variables:
  # Lint and type-check only what this repo authors.
  PYTHON_LINT_PATHS: "src tests"

  # A library's tests ARE its tier-(a) suite — there is no image to boot — so an empty run
  # must be a failure rather than a warning. A published package that nothing exercised is
  # how a breaking change reaches every consumer at once.
  PYTEST_ALLOW_NO_TESTS: "false"

# ---------------------------------------------------------------------------------------
# Runner tags — READ THIS BEFORE "CLEANING UP" THE BLOCKS BELOW
# ---------------------------------------------------------------------------------------
# globals.yml tags jobs through two anchors, `.default_runner` and `.default_runner_infra`,
# whose value comes from ${RUNNER_TAG} / ${RUNNER_TAG_INFRA} (default:
# `saas-linux-small-amd64`, GitLab.com's shared SaaS runners). Overriding the anchors here
# retargets every job that EXTENDS them onto our own fleet; the main file wins over an
# include, and the anchors carry nothing but `tags`, so the override is complete.
#
# `get_unique_semversion` (auto-semversioning.yml) is a plain job with NO `extends:` at all,
# so it inherits no tags and is eligible for ANY runner the project can see — in practice it
# escapes to the SaaS shared runners, burning paid minutes or hanging in `pending` where the
# project has no shared-runner entitlement. Overriding `.default_runner` does not reach it.
# That is why the third block exists and why it is not redundant. The shared templates are
# not ours to patch, and a per-job `tags:` in the main file wins over the include.
#
# In the service template a FOURTH block overrides `SBOM-cyclonedx-image` (docker-build.yml)
# for the same reason. It is deliberately absent here: that job does not exist in this
# pipeline, and naming a non-existent job would CREATE one — a job with `tags` and no
# `script`, which fails the whole config with "jobs:SBOM-cyclonedx-image config should
# implement a script: or trigger: keyword". Add the block only if this repo ever includes
# /docker-build.yml, which for a library it should not.
#
# The tag must be a LITERAL: GitLab expands variables in `tags` but not nested references
# (gitlab-org/gitlab#407129), so a variable holding another variable becomes a literal tag
# string and the job never matches a runner. Substitute `@@RUNNER_TAG@@` with the literal tag
# of the runner fleet your infra repo registered, in all three blocks below — they must stay
# in sync. Keep it QUOTED while it is still a token: a plain YAML scalar may not begin with
# `@`, and the parser reports that as a syntax error somewhere else in the file.
.default_runner:
  tags:
    - "@@RUNNER_TAG@@"

.default_runner_infra:
  tags:
    - "@@RUNNER_TAG@@"

get_unique_semversion:
  tags:
    - "@@RUNNER_TAG@@"

# ---------------------------------------------------------------------------------------
# Publish to the group PyPI registry
# ---------------------------------------------------------------------------------------
# Inline rather than included because the shared templates have no Python publish job yet.
# If a second repo needs this, MOVE IT INTO @@CI_TEMPLATES_PROJECT@@ instead of copying it —
# a publish job duplicated across repos is a supply-chain surface maintained in n places.
publish_pypi:
  stage: package
  extends:
    - .default_runner
  image: "${PYTHON_IMAGE}"
  needs:
    - job: get_unique_semversion
      artifacts: true          # brings GitVersion_SemVer in as a dotenv variable
  rules:
    # GATED ON BRANCHES, NOT ON TAGS — deliberately.
    # The branch model is feature/* -> dev -> rc -> release and there are NO git tags: a
    # merge to `rc` publishes a pre-release, a merge to `release` publishes the stable
    # version, and both merges are approval-gated. A `$CI_COMMIT_TAG` rule here would never
    # fire, and creating a tag to make it fire would also break GitVersion, which computes
    # the version from the branch graph plus `next-version` precisely because there are no
    # tags to read.
    - if: $CI_COMMIT_BRANCH == "rc" || $CI_COMMIT_BRANCH == "release"
      when: on_success
    # Everything else — feature branches, dev, MRs — builds and tests but never publishes.
    # An accidental publish cannot be undone: PyPI-style registries refuse re-uploads of a
    # version, so a bad artifact is permanent and must be superseded rather than replaced.
    - when: never
  script:
    - |
      set -euo pipefail

      if [ -z "${GitVersion_SemVer:-}" ]; then
        echo "ERROR: GitVersion_SemVer is unset — get_unique_semversion did not run or its dotenv was not fetched"
        exit 1
      fi

      # GitVersion emits SemVer 2.0 ("0.4.0-rc.3"); Python packaging requires PEP 440
      # ("0.4.0rc3"). Left untranslated, the build backend either rejects the string or
      # normalises it silently — and a package whose version differs from the one in the
      # release notes is unfindable by the consumer who was told to pin it.
      PY_VERSION="$(printf '%s' "${GitVersion_SemVer}" \
        | sed -E 's/-alpha\.?([0-9]+)/a\1/; s/-rc\.?([0-9]+)/rc\1/; s/-dev\.?([0-9]+)/.dev\1/; s/\+.*$//')"
      echo "INFO: GitVersion_SemVer=${GitVersion_SemVer} -> PEP 440 ${PY_VERSION}"

      python -m pip install --quiet --upgrade pip
      python -m pip install --quiet hatch build twine

      # hatch writes the version into src/@@PKG@@/__init__.py (the [tool.hatch.version]
      # source) and VALIDATES it as PEP 440 first, so a malformed version fails here rather
      # than producing an unusable artifact.
      hatch version "${PY_VERSION}"

      python -m build
      # Catches a broken long_description/metadata before upload, which the registry would
      # otherwise accept and every consumer's tooling would then choke on.
      twine check dist/*

      # The project-scoped registry, authenticated with the job token: no long-lived
      # credential exists for CI to leak, and the token dies with the job.
      TWINE_USERNAME="gitlab-ci-token" \
      TWINE_PASSWORD="${CI_JOB_TOKEN}" \
      twine upload --non-interactive \
        --repository-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" \
        dist/*

      echo "INFO: published @@PROJECT@@ ${PY_VERSION} — consumers pin it as '@@PROJECT@@~=${PY_VERSION%.*}'"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# =========================================================================================
# Repo-local gates — the second and last exception to "shared CI logic lives upstream".
#
# Both jobs enforce a rule the generated CLAUDE.md states as MECHANICALLY ENFORCED ("Doc-sync
# is enforced", "Standard-drift is enforced"). Unlike publish_pypi above, these are local by
# NATURE rather than because the shared templates have not caught up yet:
#
#   * they validate THIS repository's own files — the CLAUDE.md generated here, this repo's
#     own docs — so there is no shared logic to donate upstream. A template job would need
#     every path and file name passed in as a variable before it could say anything at all,
#     and a "shared" job configured entirely per-repo is a copy with extra steps.
#   * they need nothing but bash, coreutils and git, so the usual reasons to centralise
#     (pinned tool images, registry credentials, cache tuning) do not apply.
#   * a rule advertised as enforced while nothing runs it is worse than no rule: it teaches
#     every reader that the standard is advisory, and the next rule is believed even less.
#
# If a second repo ever needs these VERBATIM, that is the signal to move them into
# @@CI_TEMPLATES_PROJECT@@ unchanged — not the signal to grow more local jobs here.
# =========================================================================================

# Standard-drift guard (CLAUDE.md "Standard-drift is enforced").
#
# CLAUDE.md is GENERATED by ./standard/compose.sh from standard/base.md +
# standard/profiles/library.md + standard/repo.env. It drifts two ways: someone edits the
# generated file (the edit dies at the next regenerate and never reaches the other repos), or
# someone edits the sources and forgets to regenerate (every agent then reads the OLD
# rulebook). Either way the group runs two standards and neither is authoritative.
#
# `standard/` is VENDORED, not referenced: compose.sh, base.md and profiles/ are copied in
# when this scaffold is instantiated, and only repo.env is filled in per repo. A missing
# ./standard/compose.sh means the repo was created by copying files by hand rather than from
# the template — fix the copy, do not delete this job.
standard-drift:
  stage: validate
  # The image the shared templates already use for their bash+git jobs, so this adds no new
  # pin to maintain. Nothing is installed at job time and nothing is fetched: the gate is pure
  # bash + coreutils and works with no network.
  image:
    name: "${IAC_BUNDLE_IMAGE}"
    entrypoint: [""]
  extends:
    - .default_runner
  # Independent of every other job — report the drift in the first seconds of the pipeline,
  # not after the test matrix.
  needs: []
  rules:
    # No branch pipeline while an MR is open for that branch: the MR pipeline covers the same
    # commit, and without this guard every push runs the gate twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always
  script:
    - |
      set -u
      # compose.sh --check prints the full diff (committed vs regenerated) before it exits,
      # so the fix is readable straight from the job log.
      rc=0
      ./standard/compose.sh --check || rc=$?
      case "$rc" in
        0) ;;
        2)
          echo "ERROR: CLAUDE.md has drifted from standard/ (diff above)."
          echo "ERROR: Edit standard/base.md or standard/profiles/<profile>.md — never CLAUDE.md"
          echo "ERROR: itself — then run ./standard/compose.sh and commit the regenerated file."
          exit 1
          ;;
        *)
          echo "ERROR: compose.sh could not run (exit ${rc}). This is a configuration error,"
          echo "ERROR: not drift: standard/repo.env is missing, incomplete, or names a profile"
          echo "ERROR: that has no standard/profiles/<profile>.md."
          exit 1
          ;;
      esac

# Doc-sync guard (CLAUDE.md "Documentation sync" rule).
#
# Fails an MR that changes the published surface of this library without touching any
# documentation. This catches the common failure mode where an agent updates code but forgets
# the docs/CHANGELOG/TODO. Agent-agnostic — it works no matter which tool wrote the diff.
# It matters more here than anywhere else: publication is irreversible, so an undocumented
# change ships to every consumer and cannot be taken back, only superseded.
#
# Escape hatch: label the MR "no-docs", or put "[skip doc-sync]" in the MR title, for the rare
# change that genuinely needs no doc update.
#
# This repo supports exactly ONE CI host. If you ever add a GitHub pipeline alongside this
# one, it needs both gates with the SAME patterns and the SAME escape hatches — otherwise the
# identical change passes on one host and fails on the other, and people learn to re-run the
# red one until it turns green.
doc-sync:
  stage: validate
  image:
    name: "${IAC_BUNDLE_IMAGE}"
    entrypoint: [""]
  extends:
    - .default_runner
  needs: []
  variables:
    # The diff base is an ordinary commit in the target branch's history, which a shallow
    # clone does not contain — with the default depth `git diff` fails with "bad object".
    GIT_DEPTH: "0"
  rules:
    # MR-scoped by construction: "did this change touch docs" is only a meaningful question
    # against a review target. On a branch push there is nothing to diff against.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      set -u
      case "${CI_MERGE_REQUEST_TITLE:-}" in
        *"[skip doc-sync]"*) echo "skip via title"; exit 0 ;;
      esac
      # CI_MERGE_REQUEST_LABELS is comma-separated; spaces are stripped so " no-docs" from a
      # hand-typed label list still matches. "dependencies" is the label Renovate is
      # configured to add — a lockfile bump legitimately carries no doc change. There is no
      # actor check: the Renovate bot's username is per-installation, so the label is the only
      # portable hook.
      labels=",$(printf '%s' "${CI_MERGE_REQUEST_LABELS:-}" | tr -d ' '),"
      case "$labels" in
        *",no-docs,"* | *",dependencies,"*) echo "skip via label"; exit 0 ;;
      esac

      # GitLab hands MR pipelines the merge base as CI_MERGE_REQUEST_DIFF_BASE_SHA. The
      # fallback exists only for the case where it is absent (an older GitLab, or a pipeline
      # shape that does not populate it) — recomputing it by hand when GitLab already knows it
      # is how two checks end up disagreeing about what "changed" means.
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$base" ]; then
        target="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:?no MR target branch}"
        git fetch --quiet origin "$target"
        base="$(git merge-base FETCH_HEAD HEAD)"
      fi

      changed="$(git diff --name-only "$base" HEAD)"
      echo "changed files:"; echo "$changed"

      # Code side, adapted to what a LIBRARY actually ships. Patterns are anchored (^) so a
      # path only counts at the repo root.
      #
      # `pyproject.toml` is IN, unlike in the service scaffold. For a library the metadata is
      # part of the product: `requires-python`, the dependency set and the extras are
      # constraints every consumer inherits, and tightening one without a CHANGELOG line
      # breaks builds in repos nobody touched. Routine bumps are what the "dependencies" label
      # above exists for.
      #
      # No `deploy/`, `helm/`, `chart/` or `Dockerfile` patterns: this profile has none of
      # them, and their appearance is not a hole in this gate. A Dockerfile alone builds
      # nothing — turning this repo into a service means adding /docker-build.yml to the
      # include list, and that edit touches .gitlab-ci.yml, which IS matched here.
      #
      # `tests/` is deliberately OUT even though for a library the suite is all of tier (a):
      # it is already gated by the Python jobs (PYTEST_ALLOW_NO_TESTS=false above), and the
      # public-API changes worth documenting land in src/ in the same commit. Listing it would
      # make every added test demand a doc edit and teach people to reach for the escape hatch
      # by reflex, which costs the gate its meaning on the changes that matter.
      code="$(echo "$changed" | grep -E '^(src/|auto-tests/|standard/|skills/|pyproject\.toml|\.github/workflows/|\.gitlab-ci\.yml)' || true)"
      # Doc side includes docs/contracts.md (the enforced export registry) via `docs/`, and
      # AUTOPILOT-LOG.md, which CLAUDE.md makes mandatory for an autonomous change of any
      # substance.
      docs="$(echo "$changed" | grep -E '^(docs/|README\.md|CHANGELOG\.md|TODO\.md|CLAUDE\.md|AUTOPILOT-LOG\.md)' || true)"

      if [ -n "$code" ] && [ -z "$docs" ]; then
        echo "ERROR: The published surface changed but no docs were updated. Update the matching"
        echo "ERROR: doc per CLAUDE.md 'Documentation sync' (CHANGELOG/docs/contracts.md/TODO), or"
        echo "ERROR: add the 'no-docs' label / '[skip doc-sync]' in the MR title if truly N/A."
        exit 1
      fi
      echo "doc-sync OK"
