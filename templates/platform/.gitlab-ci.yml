---
# CI/CD for @@PROJECT@@ — profile: platform.
#
# ############################################################################
# THIS PIPELINE LINTS AND VALIDATES. IT NEVER DEPLOYS ANYTHING.
# ############################################################################
#
# No `kubectl apply`, no `helm upgrade`, no `flux reconcile`. Not "not yet" — never. The
# reasoning, so nobody re-derives it wrongly:
#
#   * Flux reconciles this repository FROM GIT. A pipeline that also deploys is a second
#     writer to the same cluster, and the two disagree the first time a job is retried.
#   * A pipeline that can deploy must HOLD cluster credentials. Every job in it, including a
#     third-party linter with a compromised release, then runs with them.
#   * It would move the deployment decision out of review. The merge IS the deployment here;
#     a `chartVersion` bump is approved by a human precisely because nothing else gates it.
#
# The workflow this pipeline supports instead: CI proves the bundle is well-formed and renders
# to valid Flux objects, and shows the rendered diff on the merge request; a human reads that
# diff and merges. Merging is the deployment. `git revert` is the rollback.
include:
  - project: "@@CI_TEMPLATES_PROJECT@@"
    # WHAT THIS REF COSTS YOU.
    # These templates are executed code from another repository: whatever `ref` points at
    # runs with this project's CI_JOB_TOKEN and its credentials. A tag makes pipelines
    # reproducible and turns a template upgrade into a reviewed, per-repo act. A moving
    # branch does the opposite — one upstream commit changes every repo's pipeline at once,
    # with no MR and no way to reproduce yesterday's run.
    #
    # Prefer a tag. Tracking a branch is a legitimate choice when the templates repo cuts no
    # releases and same-day access to fixes matters more than reproducibility — but only as a
    # decision recorded in docs/architecture.md with its blast radius stated, never as
    # something nobody got around to. Before switching to a tag, check the tag actually
    # contains every file included below; a tag trailing the branch is worse than the branch.
    ref: "@@CI_TEMPLATES_REF@@"
    file:
      - "/globals.yml"   # stages, runner-tag anchors, tool image pins
      - "/sast.yml"      # gitleaks first, checkov second; the rest self-skip

# NOT included, deliberately:
#   /auto-semversioning.yml  this repo publishes no artifact. The only versions here are the
#                            ones PINNED in each bundle, and they belong to the repos that
#                            built them. A SemVer of its own would be a number describing
#                            nothing — what is "released" is the state of an environment, and
#                            the git commit already identifies it.
#   /lint.yml                its Python gate self-activates on pyproject.toml, which this repo
#                            deliberately does not have: scripts/ are three standalone
#                            executables, not a package. They are exercised on every MR by
#                            validate-bundles and render-diff below, which run them against
#                            the real tree — a stronger statement than a linter's.
#   /docker-build.yml, /helm-package.yml, /functional.yml, /commit_changes.yml
#                            no image, no chart, no artifact to commit back. A chart ships
#                            from the service it deploys; this repo only pins a version of it.

variables:
  # gitleaks is the load-bearing scanner in a platform repo. The entire secrets model rests on
  # "no secret value is ever committed" — every credential is a REFERENCE resolved in-cluster
  # by the secrets operator — and this is the one repo where the shortcut ("just this once, in
  # values/") is both tempting and immediately effective. checkov earns its place too: raw
  # resources under clusters/**/manifests/ go to the API server unchanged.
  SAST_DISABLED: "false"

# ---------------------------------------------------------------------------------------
# Runner tags — READ THIS BEFORE "CLEANING UP" THE TWO BLOCKS BELOW
# ---------------------------------------------------------------------------------------
# globals.yml tags jobs through two anchors, `.default_runner` and `.default_runner_infra`,
# whose value comes from ${RUNNER_TAG} / ${RUNNER_TAG_INFRA} (default: the platform's hosted
# runners). Overriding them here retargets every job that EXTENDS them — which, in this
# pipeline, is every job: the SAST jobs extend `.default_runner_infra`, and every local job
# below extends one of the two explicitly.
#
# Which anchor a local job uses is a statement about what it needs, not a coin toss. The
# validation jobs read files and nothing else, so they take `.default_runner`; `e2e` is the
# only job that must reach a real cluster's network, so it takes `.default_runner_infra`. Both
# resolve to the same literal tag today, which is exactly why the distinction has to be
# written down now — it is unrecoverable once someone splits the two fleets.
#
# The service template additionally overrides two jobs BY NAME — `get_unique_semversion`
# (auto-semversioning.yml) and `SBOM-cyclonedx-image` (docker-build.yml) — because those carry
# no tags at all and would otherwise escape to the hosted shared runners. Those blocks are
# deliberately ABSENT here: neither template is included, so neither job exists, and naming a
# non-existent job would CREATE one — a job with `tags` and no `script`, which fails the entire
# config with "jobs:<name> config should implement a script: or trigger: keyword". If this repo
# ever includes either template, add the matching override at the same time.
#
# The tag must be a LITERAL: GitLab expands variables in `tags` but not nested references
# (gitlab-org/gitlab#407129), and a job whose tag never matches sits in `pending` forever with
# no error to read. Keep it QUOTED while it is still a token — a plain YAML scalar may not
# begin with `@`, and the parser reports that as a syntax error somewhere else in the file.
.default_runner:
  tags:
    - "@@RUNNER_TAG@@"

.default_runner_infra:
  tags:
    - "@@RUNNER_TAG@@"

# Every local job below sits in `validate`. That is the stage globals.yml defines which this
# repo can rely on, and nothing here builds or publishes, so a second stage would only add a
# serialisation point between jobs that are already independent (`needs: []`).

# ---------------------------------------------------------------------------------------
# Formatting across the tree
# ---------------------------------------------------------------------------------------
# This repo IS YAML. Every file it owns is read by a machine that will happily accept a
# structurally valid document that means something other than what was written — which is what
# .yamllint is tuned for: strict about duplicate keys, implicit octals and accidental booleans,
# lenient about line length.
#
# The job is named for the check it runs, matching the CI table in standard/profiles/platform.md.
# One consequence to know: a job defined in the main file OVERRIDES an included job of the same
# name. If a shared template ever ships a `yamllint` job, this block silently replaces it rather
# than running alongside it — so check that before adding an include, and rename this job if it
# happens.
yamllint:
  stage: validate
  extends:
    - .default_runner
  image:
    name: "${IAC_BUNDLE_IMAGE}"
    entrypoint: [""]
  needs: []
  rules:
    - if: $NO_LINT_CHECKS == "true"
      when: never
    - when: always
  script:
    - |
      set -eu

      # The bundle image normally ships yamllint; installing on demand keeps the job working
      # if the image is ever slimmed, instead of failing with "command not found" in the one
      # pipeline standing between a typo and a shared environment.
      if ! command -v yamllint >/dev/null 2>&1; then
        echo "INFO: yamllint not present in ${IAC_BUNDLE_IMAGE} — installing it"
        python3 -m pip install --quiet --disable-pip-version-check yamllint
      fi

      yamllint .
      echo "OK: formatting is clean."

# ---------------------------------------------------------------------------------------
# The schema gate
# ---------------------------------------------------------------------------------------
# Every bundle against bundle.schema.json, plus the cross-field checks a schema cannot
# express: a name used twice, a values file nobody references, an environment directory whose
# name is not in its bundle name. `additionalProperties: false` throughout is what makes a
# typo'd key fail here rather than silently deploy nothing.
validate-bundles:
  stage: validate
  extends:
    - .default_runner
  image:
    name: "${IAC_BUNDLE_IMAGE}"
    entrypoint: [""]
  needs: []
  rules:
    # `exists:` so the job is not created at all in a repo whose tree is still a plan. A job
    # that always passes because it found nothing to check is worse than a missing job: it
    # looks like coverage.
    - exists:
        - clusters/*/environments/*/bundle.yaml
      when: always
  script:
    - |
      set -eu
      python3 -c 'import yaml, jsonschema' 2>/dev/null || {
        echo "INFO: installing the two libraries scripts/ needs"
        python3 -m pip install --quiet --disable-pip-version-check pyyaml jsonschema
      }
      python3 scripts/validate-bundles.py

# ---------------------------------------------------------------------------------------
# The render, and its diff
# ---------------------------------------------------------------------------------------
# Rendering is this repo's "does it compile": it turns every bundle into the Flux objects the
# controller would receive, WITHOUT touching a cluster. The diff against the merge base is the
# artefact a reviewer actually reads — a one-character `chartVersion` change is unreviewable as
# a diff of the bundle and obvious as a diff of the rendered OCIRepository.
#
# The rendered output is never committed. It is derived, and a committed render is a second
# source of truth that is wrong the moment someone edits one of the two.
render-diff:
  stage: validate
  extends:
    - .default_runner
  image:
    name: "${IAC_BUNDLE_IMAGE}"
    entrypoint: [""]
  needs: []
  variables:
    # The merge base is an ordinary commit in the target branch's history, which a shallow
    # clone does not contain — `git archive` on it fails with "not a valid object name".
    GIT_DEPTH: "0"
  rules:
    - exists:
        - clusters/*/environments/*/bundle.yaml
      when: always
  script:
    - |
      set -eu
      python3 -c 'import yaml' 2>/dev/null || \
        python3 -m pip install --quiet --disable-pip-version-check pyyaml

      work="$(mktemp -d)"
      echo "== render HEAD =="
      python3 scripts/render.py --all --out-dir "${work}/after"

      # Structural check on what came out. render.py builds the documents itself, so this is
      # not "is it YAML" — it is the invariant that survives someone editing the renderer: every
      # object is addressable, and every HelmRelease points at a source that was actually
      # emitted. A HelmRelease whose chartRef names a missing OCIRepository does not fail; it
      # sits in the cluster NotReady, which looks like a slow deploy for as long as you let it.
      python3 - "${work}/after" <<'PY'
      import pathlib
      import sys

      import yaml

      out = pathlib.Path(sys.argv[1])
      problems: list[str] = []
      sources: set[tuple[str, str]] = set()
      releases: list[tuple[str, str, str, pathlib.Path]] = []

      for path in sorted(out.glob("*.yaml")):
          for i, doc in enumerate(d for d in yaml.safe_load_all(path.read_text(encoding="utf-8")) if d):
              meta = doc.get("metadata") or {}
              missing = [k for k in ("apiVersion", "kind") if not doc.get(k)]
              if not meta.get("name"):
                  missing.append("metadata.name")
              if missing:
                  problems.append(f"{path.name}[{i}]: missing {', '.join(missing)}")
                  continue
              name, namespace = meta["name"], meta.get("namespace", "")
              if doc["kind"] == "OCIRepository":
                  sources.add((namespace, name))
              elif doc["kind"] == "HelmRelease":
                  ref = (doc.get("spec") or {}).get("chartRef") or {}
                  releases.append((ref.get("namespace", namespace), ref.get("name", ""), name, path))

      for ns, ref_name, release, path in releases:
          if (ns, ref_name) not in sources:
              problems.append(
                  f"{path.name}: HelmRelease {release!r} references OCIRepository "
                  f"{ns}/{ref_name!r}, which was never rendered"
              )

      for problem in problems:
          print(f"ERROR: {problem}")
      print(f"rendered output: {len(sources)} source(s), {len(releases)} release(s), "
            f"{len(problems)} problem(s)")
      sys.exit(1 if problems else 0)
      PY

      # The diff is informational: it is what the reviewer reads, and a rendered change with
      # no bundle change (or the reverse) is the signal to look harder. It never fails the job
      # — every deployment is a rendered change by definition.
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "${base}" ]; then
        echo "INFO: not a merge request pipeline — rendered output above, no diff to show."
        exit 0
      fi
      mkdir -p "${work}/base"
      git archive "${base}" | tar -x -C "${work}/base"
      echo "== render the merge base (${base}) =="
      (cd "${work}/base" && python3 scripts/render.py --all --out-dir "${work}/before") || {
        echo "INFO: the merge base does not render — showing no diff. This is normal for the"
        echo "INFO: first environment, and suspicious for anything else."
        exit 0
      }
      echo "== what this merge request changes in the cluster =="
      diff -ru "${work}/before" "${work}/after" || true

# ---------------------------------------------------------------------------------------
# Tier (d) — cross-service end-to-end
# ---------------------------------------------------------------------------------------
# The one job here that touches a real environment, and the one exception to "this pipeline
# holds no credentials" — bounded deliberately:
#
#   * MANUAL, always. It runs against a live environment, so a human decides when. Nothing
#     schedules it and no push triggers it.
#   * `allow_failure: true`, so a manual job cannot leave the pipeline blocked. E2E is a
#     PROMOTION gate, not a merge gate: the enforcement is that a promotion MR states which
#     e2e run was green in the source environment (docs/tests.md, TODO.md). A blocking manual
#     job would only teach everyone to click it and move on.
#   * The credential is a kubeconfig scoped to ONE non-production environment, read/test only,
#     never cluster-admin and never the one the reconciler uses. Protected + masked CI
#     variable. If tier (d) ever needs to write outside its own test fixtures, that is a
#     design problem in the test, not a reason to widen the token.
#
# The scenarios themselves live in e2e/ — see its README for what belongs there.
e2e:
  stage: validate
  extends:
    - .default_runner_infra
  image:
    name: "${IAC_BUNDLE_IMAGE}"
    entrypoint: [""]
  needs: []
  rules:
    - exists:
        - e2e/**/*.sh
      when: manual
      allow_failure: true
  script:
    - |
      set -eu
      if [ -z "${KUBECONFIG:-}" ] && [ -z "${E2E_KUBECONFIG:-}" ]; then
        echo "ERROR: no kubeconfig. Tier (d) runs against a REAL environment; there is no"
        echo "ERROR: mock and a skipped e2e that reports success is worse than no e2e at all."
        echo "ERROR: Set E2E_KUBECONFIG (protected, masked, read/test scope, non-production)."
        exit 1
      fi
      if [ -n "${E2E_KUBECONFIG:-}" ]; then
        # A file, never an inline value: an exported kubeconfig ends up in `env` output and in
        # any job log that echoes the environment.
        umask 077
        printf '%s' "${E2E_KUBECONFIG}" > "${CI_PROJECT_DIR}/.e2e-kubeconfig"
        KUBECONFIG="${CI_PROJECT_DIR}/.e2e-kubeconfig"
        export KUBECONFIG
      fi

      # Same exit contract as the auto-tests groups: 0 pass, 77 skip, anything else fail. A
      # scenario that cannot run says 77 and says why — it never returns 0.
      failed=0
      ran=0
      for scenario in e2e/*.sh; do
        [ -f "${scenario}" ] || continue
        echo "== ${scenario}"
        rc=0
        sh "${scenario}" || rc=$?
        case "${rc}" in
          0)  ran=$((ran + 1)); echo "PASS ${scenario}" ;;
          77) echo "SKIP ${scenario}" ;;
          *)  failed=$((failed + 1)); echo "FAIL ${scenario} (exit ${rc})" ;;
        esac
      done
      echo "e2e: ${ran} passed, ${failed} failed"
      exit $((failed > 0))

# =========================================================================================
# Repo-local gates — they check the repo, not the cluster.
#
# Both jobs enforce a rule the generated CLAUDE.md states as MECHANICALLY ENFORCED ("Doc-sync
# is enforced", "Standard-drift is enforced"). Like the jobs above they are local by nature
# rather than by convenience:
#
#   * they validate THIS repository's own files — the CLAUDE.md generated here, this repo's
#     own docs — so there is no shared logic to donate upstream. A template job would need
#     every path and file name passed in as a variable before it could say anything at all,
#     and a "shared" job configured entirely per-repo is a copy with extra steps.
#   * they need nothing but bash, coreutils and git, so the usual reasons to centralise
#     (pinned tool images, registry credentials, cache tuning) do not apply.
#   * a rule advertised as enforced while nothing runs it is worse than no rule: it teaches
#     every reader that the standard is advisory, and the next rule is believed even less.
#
# They hold no cluster credential and deploy nothing, so they do not weaken the guarantee at
# the top of this file. If a second repo ever needs them VERBATIM, that is the signal to move
# them into @@CI_TEMPLATES_PROJECT@@ unchanged — not to grow more local jobs here.
# =========================================================================================

# Standard-drift guard (CLAUDE.md "Standard-drift is enforced").
#
# CLAUDE.md is GENERATED by ./standard/compose.sh from standard/base.md +
# standard/profiles/platform.md + standard/repo.env. It drifts two ways: someone edits the
# generated file (the edit dies at the next regenerate and never reaches the other repos), or
# someone edits the sources and forgets to regenerate (every agent then reads the OLD
# rulebook). Either way the group runs two standards and neither is authoritative — and this
# is the repo whose rulebook says a version bump is a deployment needing human approval.
#
# `standard/` is VENDORED, not referenced: compose.sh, base.md and profiles/ are copied in
# when this scaffold is instantiated, and only repo.env is filled in per repo. A missing
# ./standard/compose.sh means the repo was created by copying files by hand rather than from
# the template — fix the copy, do not delete this job.
standard-drift:
  stage: validate
  # Same bundle image the jobs above already pull, so this adds no new pin to maintain.
  # Nothing is installed at job time and nothing is fetched: the gate is pure bash +
  # coreutils and works with no network — it cannot go red because a registry is down.
  image:
    name: "${IAC_BUNDLE_IMAGE}"
    entrypoint: [""]
  extends:
    - .default_runner
  # Independent of every other job — report the drift in the first seconds of the pipeline,
  # not after the render.
  needs: []
  rules:
    # Deliberately NOT gated on $NO_LINT_CHECKS like yamllint above: that switch exists to get
    # an urgent fix through a linter that is wrong, and it must not also silence the rulebook
    # check, which cannot be "wrong about an environment" at all.
    #
    # No branch pipeline while an MR is open for that branch: the MR pipeline covers the same
    # commit, and without this guard every push runs the gate twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always
  script:
    - |
      set -u
      # compose.sh --check prints the full diff (committed vs regenerated) before it exits,
      # so the fix is readable straight from the job log.
      rc=0
      ./standard/compose.sh --check || rc=$?
      case "$rc" in
        0) ;;
        2)
          echo "ERROR: CLAUDE.md has drifted from standard/ (diff above)."
          echo "ERROR: Edit standard/base.md or standard/profiles/<profile>.md — never CLAUDE.md"
          echo "ERROR: itself — then run ./standard/compose.sh and commit the regenerated file."
          exit 1
          ;;
        *)
          echo "ERROR: compose.sh could not run (exit ${rc}). This is a configuration error,"
          echo "ERROR: not drift: standard/repo.env is missing, incomplete, or names a profile"
          echo "ERROR: that has no standard/profiles/<profile>.md."
          exit 1
          ;;
      esac

# Doc-sync guard (CLAUDE.md "Documentation sync" rule).
#
# Fails an MR that changes what is deployed, how it is rendered, or what this platform demands
# of a cluster, without touching any documentation. This catches the common failure mode where
# an agent changes an environment but forgets the contracts registry / environments doc /
# CHANGELOG. Agent-agnostic — it works no matter which tool wrote the diff.
#
# In this repo the documentation is the only durable record of INTENT. The bundle says what
# version is deployed; nothing in the tree says why it was promoted, what tier-(d) run backed
# it, or which contract change it belongs to — and that is exactly what the next person needs
# when the environment misbehaves three weeks later. A `chartVersion` bump is also the smallest
# diff in the group with the largest effect, which is precisely the shape of change that slips
# through review undocumented.
#
# Escape hatch: label the MR "no-docs", or put "[skip doc-sync]" in the MR title, for the rare
# change that genuinely needs no doc update.
#
# This repo supports exactly ONE CI host. If you ever add a GitHub pipeline alongside this
# one, it needs both gates with the SAME patterns and the SAME escape hatches — otherwise the
# identical change passes on one host and fails on the other, and people learn to re-run the
# red one until it turns green.
doc-sync:
  stage: validate
  image:
    name: "${IAC_BUNDLE_IMAGE}"
    entrypoint: [""]
  extends:
    - .default_runner
  needs: []
  variables:
    # The diff base is an ordinary commit in the target branch's history, which a shallow
    # clone does not contain — with the default depth `git diff` fails with "bad object".
    GIT_DEPTH: "0"
  rules:
    # MR-scoped by construction: "did this change touch docs" is only a meaningful question
    # against a review target. On a branch push there is nothing to diff against.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      set -u
      case "${CI_MERGE_REQUEST_TITLE:-}" in
        *"[skip doc-sync]"*) echo "skip via title"; exit 0 ;;
      esac
      # CI_MERGE_REQUEST_LABELS is comma-separated; spaces are stripped so " no-docs" from a
      # hand-typed label list still matches. "dependencies" is the label Renovate is
      # configured to add — a pinned-version bump legitimately carries no doc change. There is
      # no actor check: the Renovate bot's username is per-installation, so the label is the
      # only portable hook.
      labels=",$(printf '%s' "${CI_MERGE_REQUEST_LABELS:-}" | tr -d ' '),"
      case "$labels" in
        *",no-docs,"* | *",dependencies,"*) echo "skip via label"; exit 0 ;;
      esac

      # GitLab hands MR pipelines the merge base as CI_MERGE_REQUEST_DIFF_BASE_SHA. The
      # fallback exists only for the case where it is absent (an older GitLab, or a pipeline
      # shape that does not populate it) — recomputing it by hand when GitLab already knows it
      # is how two checks end up disagreeing about what "changed" means.
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$base" ]; then
        target="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:?no MR target branch}"
        git fetch --quiet origin "$target"
        base="$(git merge-base FETCH_HEAD HEAD)"
      fi

      changed="$(git diff --name-only "$base" HEAD)"
      echo "changed files:"; echo "$changed"

      # Code side, adapted to a repo whose "code" is a declaration of what runs where.
      # `clusters/` is the deployed state (bundles, values and the raw manifests beneath them),
      # `scripts/` is what CI and humans execute, `bundle.schema.json` defines what a bundle may
      # even say, and `requirements.yaml` is a standing demand on another team. Patterns are
      # anchored (^) so a path only counts at the repo root.
      #
      # `e2e/` is IN, unlike `tests/` in the service scaffold. There the argument for excluding
      # it was that a behaviour change touches src/ in the same commit anyway; here the opposite
      # is true — a tier-(d) test usually moves ALONE, because the contract it exercises changed
      # in some other repo. That MR is exactly the one that must update docs/tests.md and
      # docs/contracts.md, and it is the one nothing else would catch.
      code="$(echo "$changed" | grep -E '^(clusters/|e2e/|scripts/|auto-tests/|standard/|skills/|bundle\.schema\.json|requirements\.yaml|\.github/workflows/|\.gitlab-ci\.yml)' || true)"
      # Doc side includes docs/environments.md and docs/contracts.md via `docs/`, and
      # AUTOPILOT-LOG.md, which CLAUDE.md makes mandatory for an autonomous change of any
      # substance.
      docs="$(echo "$changed" | grep -E '^(docs/|README\.md|CHANGELOG\.md|TODO\.md|CLAUDE\.md|AUTOPILOT-LOG\.md)' || true)"

      if [ -n "$code" ] && [ -z "$docs" ]; then
        echo "ERROR: What is deployed changed but no docs were updated. Update the matching doc"
        echo "ERROR: per CLAUDE.md 'Documentation sync' (CHANGELOG/docs/environments.md/"
        echo "ERROR: contracts/tests/TODO), or add the 'no-docs' label / '[skip doc-sync]' in the"
        echo "ERROR: MR title if truly N/A."
        exit 1
      fi
      echo "doc-sync OK"
