---
# Development environment on the cluster whose directory this file lives under.
# The only file a release touches: bump chartVersion here, in a merge request.
#
# `example-cluster`, `example-platform` and `example-service` are scaffold names. Rename the
# cluster directory to your real kubecontext and these values to your platform's, in one
# change. They are literal strings rather than substituted scaffold tokens because
# `bundle.schema.json` constrains `name` and `namespace` to DNS labels, and
# `validate-bundles.py` requires the bundle name to contain the environment directory name —
# a placeholder carrying `@` or `<` would fail this repo's own gate on the first pipeline.
name: example-platform-dev
namespace: example-platform
imageRegistry: <registry>/<group>
vaultPathPrefix: dev
# Provisioned by the infra repo into BOTH this namespace and flux-system, rendered from the
# secret store by an ExternalSecret. Not created here.
#
# A placeholder, like `imageRegistry` above, for two independent reasons.
#
# 1. The previous literal was `gitlab-registry`, which hardcodes one CI host into a scaffold
#    the standard requires to be host-agnostic. An adopter on another host would inherit a
#    name that describes somebody else's registry.
# 2. It also silenced a checkov false positive. `CKV_SECRET_6` (Base64 High Entropy String)
#    fires on the *name* of a Kubernetes Secret, because an entropy detector cannot tell a
#    reference from a payload. What each alternative actually does, measured on checkov 3.3.1
#    with one line per file rather than assumed:
#      - quoting the value, single or double: still FAILED. The check runs on the parsed
#        string, so the quotes never reach it.
#      - `# checkov:skip=CKV_SECRET_6:` on the *preceding* line: `Skipped checks: 1`. It
#        works, and it is counted.
#      - the same comment appended to the *same* line: the finding disappears entirely —
#        `Passed 0, Failed 0, Skipped 0`. A control with an ordinary trailing comment still
#        FAILED, so this is suppression rather than a change in the line's entropy.
#      - `skip-check` in `.checkov.yaml`: disables the id repo-wide, which is the one outcome
#        worth avoiding — a real base64 blob committed into a bundle is precisely the mistake
#        this scan exists to catch.
#
#    An earlier version of this comment claimed the secrets framework ignores inline
#    suppressions altogether. That was false, and it had been written from a single
#    same-line test whose silence was read as "no effect" when it was in fact total
#    suppression — the two are indistinguishable without the control above.
#
#    Prefer the preceding-line form to the same-line one **when a skip is warranted at all**:
#    only that form appears in the report as `Skipped`, and a suppression nobody can count is
#    a suppression nobody can review. Here no skip is warranted, because the placeholder fixes
#    the actual defect rather than hiding its symptom, and leaves the check live for a real
#    payload.
imagePullSecret: <image-pull-secret>
interval: 30m

microservices:
  # Deploy one trivial service first: it validates the CI -> OCI -> Flux delivery path end to
  # end before any real workload depends on it. Version read from that service's committed
  # .versions/helm-chart.env — never typed from memory.
  - service: example-service
    repoURL: oci://<registry>/<group>/charts
    chartVersion: 0.1.0

platform: []
