---
# Local k3s (kk-omen), development environment.
# The only file a release touches: bump chartVersion here, in a merge request.
name: job-agent-dev
namespace: job-agent
imageRegistry: registry.gitlab.com/job-agent
vaultPathPrefix: dev
# Provisioned by the infra repo into BOTH job-agent and flux-system, rendered from
# Vault by an ExternalSecret. Not created here.
imagePullSecret: gitlab-registry
interval: 30m

microservices:
  # Validates the CI -> OCI -> Flux delivery path end to end. Version read from
  # test-ci's committed .versions/helm-chart.env.
  - service: test-ci
    repoURL: oci://registry.gitlab.com/job-agent/charts
    chartVersion: 0.0.1-5

platform: []
