---
# Variables for every host in the `laptop-local` environment.
#
# EVERY VERSION HERE IS EXACT. That is the point of this file: the pins that decide what the
# substrate actually is are collected in one reviewable place, instead of being scattered
# through roles where a bump is invisible in a diff.
#
# Non-secret values only. Credentials come from the environment or a secret store at run
# time — see docs/configuration.md, which names where each one originates.
cluster_name: laptop-local

# Pinned exactly. A range or `latest` would mean the cluster that exists and the cluster this
# repo describes are two different things, and only one of them is reviewable.
kubernetes_version: "1.31.4"

# Cluster-wide platform components this repo installs. Application versions are NOT here:
# which version of which app runs is the platform repo's bundle, and an infra repo that pins
# an application version has taken over a job it cannot do consistently across environments.
cert_manager_version: "1.16.2"
gateway_api_version: "1.2.1"
external_secrets_version: "0.12.1"
