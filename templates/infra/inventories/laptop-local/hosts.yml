---
# Inventory for the `laptop-local` environment.
#
# One directory per environment (`inventories/<env>/`), never one file with groups pretending
# to be environments: the separation is what makes it structurally impossible to run a
# production play with a `--limit` typo. `ansible.cfg` points at `inventories/`, so a run
# always names its environment explicitly:
#
#   ansible-playbook -i inventories/laptop-local playbooks/site.yml --check --diff
#
# Hosts are addressed by a name resolvable from the operator's machine. Connection secrets
# (keys, passwords) never appear here — see docs/configuration.md for where they come from.
all:
  children:
    cluster:
      hosts:
        # Replace with the real machines. `ansible_host` carries the address so the
        # inventory name can stay a stable, human-meaningful identifier even when the
        # address changes.
        laptop-local-node-1:
          ansible_host: 127.0.0.1
          ansible_connection: local
      # No `vars:` block on purpose. Group-level variables live in group_vars/all.yml: a
      # value inline in the inventory is invisible to anyone reading group_vars/, and that
      # is the usual reason two environments "should be identical" and are not.
