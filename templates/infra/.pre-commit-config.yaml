# Local gates mirroring CI. In this repo they matter more than usual: the feedback loop for
# an infra mistake is not a red pipeline, it is a cluster.
#
# One-time setup per clone:
#   pip install pre-commit && pre-commit install
#
# Hook versions are PINNED — a hook is code from another repository executed against this
# checkout, and this is the repo that holds the keys to everything else.
repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: "v1.37.1"
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint"]

  - repo: https://github.com/bridgecrewio/checkov
    rev: "3.3.8"
    hooks:
      - id: checkov
        # pass_filenames: false — checkov reasons across resources (the CKV2_* checks), and
        # handed only the changed files it silently loses exactly those.
        always_run: true
        pass_filenames: false
        args: ["--config-file", ".checkov.yaml"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: "v8.30.1"
    hooks:
      # The most valuable hook in an infra repo. Bootstrap credentials are handled here by
      # definition, and "I will remove it before pushing" is not a control — a secret that
      # reaches a remote branch is compromised even after a force-push.
      - id: gitleaks
