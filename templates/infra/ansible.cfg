# Ansible defaults for @@PROJECT@@.
#
# Committed on purpose: "it worked on my machine" in an infra repo usually means "my
# ~/.ansible.cfg differed". Everything that changes what a run DOES lives here, in git,
# reviewed — the same rule the rest of this repo follows.
[defaults]
inventory = inventories/
roles_path = roles:.ansible/roles
collections_path = .ansible/collections:collections
# YAML output makes a --check --diff readable by a human, which is the review step that
# stands between a plan and an apply.
stdout_callback = yaml
# The plan is the deliverable: show what WOULD change, always.
callbacks_enabled = profile_tasks
retry_files_enabled = false
# Facts are cheap and a run that guesses is a run that surprises.
gathering = smart
interpreter_python = auto_silent
# 30 minutes of fact cache: long enough to make a repeated --check fast, short enough that a
# rebuilt host is not described by stale facts.
fact_caching = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout = 1800

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

[inventory]
# An inventory file that fails to parse must be an ERROR. Ansible's default is to warn and
# carry on with an empty inventory, which produces the worst possible outcome: a play that
# reports success having touched nothing.
unparsed_is_failed = true
