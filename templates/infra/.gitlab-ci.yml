---
# CI/CD for @@PROJECT@@ — profile: infra.
#
# ############################################################################
# THIS PIPELINE LINTS AND VALIDATES. IT NEVER APPLIES ANYTHING.
# ############################################################################
#
# No `kubectl apply`, no `helm upgrade`, no `flux reconcile`. Not "not yet" — never. The
# reasoning, so nobody re-derives it wrongly:
#
#   * A pipeline that can apply must HOLD cluster-admin credentials. Every job in it,
#     including a third-party linter with a compromised release, then runs with those
#     credentials. That standing risk is far larger than the manual step it saves.
#   * Infra changes are the least reversible in the platform: a bad CNI change costs the
#     cluster, a bad runner change costs CI itself — including the pipeline you would need in
#     order to fix it.
#   * It would defeat the point. The reconciler applies from git, so a pipeline that also
#     applies creates a second writer and two sources of truth.
#
# The workflow this pipeline supports instead: CI proves the change is well-formed and renders
# to valid Kubernetes objects; a human reads the diff (`flux build`, `flux diff`,
# `kubectl diff`) and merges. Merging is the apply. `docs/runbook.md` documents each command.
include:
  - project: "@@CI_TEMPLATES_PROJECT@@"
    # WHAT THIS REF COSTS YOU.
    # These templates are executed code from another repository: whatever `ref` points at
    # runs with this project's CI_JOB_TOKEN and its credentials. A tag makes pipelines
    # reproducible and turns a template upgrade into a reviewed, per-repo act. A moving
    # branch does the opposite — one upstream commit changes every repo's pipeline at once,
    # with no MR and no way to reproduce yesterday's run.
    #
    # Prefer a tag. Tracking a branch is a legitimate choice when the templates repo cuts no
    # releases and same-day access to fixes matters more than reproducibility — but only as a
    # decision recorded in docs/architecture.md with its blast radius stated, never as
    # something nobody got around to. Before switching to a tag, check the tag actually
    # contains every file included below; a tag trailing the branch is worse than the branch.
    ref: "@@CI_TEMPLATES_REF@@"
    file:
      - "/globals.yml"   # stages, runner-tag anchors, tool image pins
      - "/sast.yml"      # checkov + gitleaks matter most here; the rest self-skip

# NOT included, deliberately:
#   /auto-semversioning.yml  this repo publishes no artifact, so there is nothing to version.
#                            A SemVer on applied configuration is a number that describes
#                            nothing: what is deployed is the state of the cluster, and the
#                            git commit is already its identifier.
#   /docker-build.yml, /helm-package.yml, /functional.yml, /commit_changes.yml
#                            no image, no chart, no artifact to commit back.

variables:
  # checkov and gitleaks are the two scanners that earn their keep in an infra repo: one
  # reads the manifests this repo owns, the other stops a bootstrap credential from being
  # committed "just for a minute".
  SAST_DISABLED: "false"

# ---------------------------------------------------------------------------------------
# Runner tags — READ THIS BEFORE "CLEANING UP" THE TWO BLOCKS BELOW
# ---------------------------------------------------------------------------------------
# globals.yml tags jobs through two anchors, `.default_runner` and `.default_runner_infra`,
# whose value comes from ${RUNNER_TAG} / ${RUNNER_TAG_INFRA} (default: the platform's hosted
# runners). Overriding them here retargets every job that EXTENDS them — which, in this
# pipeline, is every job: the SAST jobs extend `.default_runner_infra`, and every local job
# below extends one of the two explicitly.
#
# The service template additionally overrides two jobs BY NAME — `get_unique_semversion`
# (auto-semversioning.yml) and `SBOM-cyclonedx-image` (docker-build.yml) — because those carry
# no tags at all and would otherwise escape to the hosted shared runners. Those blocks are
# deliberately ABSENT here: neither template is included, so neither job exists, and naming a
# non-existent job would CREATE one — a job with `tags` and no `script`, which fails the entire
# config with "jobs:<name> config should implement a script: or trigger: keyword". If this repo
# ever includes either template, add the matching override at the same time.
#
# The tag must be a LITERAL: GitLab expands variables in `tags` but not nested references
# (gitlab-org/gitlab#407129). Chicken-and-egg is real here — this repo deploys the runner its
# own pipeline is tagged for. Before that runner exists, point these at a hosted tag,
# bootstrap following docs/runbook.md, then switch back.
.default_runner:
  tags:
    - "@@RUNNER_TAG@@"

.default_runner_infra:
  tags:
    - "@@RUNNER_TAG@@"

# ---------------------------------------------------------------------------------------
# Lint the GitOps tree
# ---------------------------------------------------------------------------------------
lint_gitops:
  stage: validate
  extends:
    - .default_runner_infra
  image:
    name: "${IAC_BUNDLE_IMAGE}"
  rules:
    - if: $NO_LINT_CHECKS == "true"
      when: never
    # `exists:` so the job is not created at all in a repo whose tree is still a plan. A job
    # that always passes because it found nothing to check is worse than a missing job: it
    # looks like coverage.
    - exists:
        - clusters/**/kustomization.yml
        - clusters/**/kustomization.yaml
      when: always
  script:
    - |
      set -euo pipefail

      # The bundle image normally ships these; installing on demand keeps the job working if
      # the image is ever slimmed, instead of failing with "command not found" in a repo whose
      # pipeline is the only thing standing between a typo and the cluster.
      if ! command -v yamllint >/dev/null 2>&1; then
        echo "INFO: yamllint not present in ${IAC_BUNDLE_IMAGE} — installing it"
        python3 -m pip install --quiet --disable-pip-version-check yamllint
      fi

      echo "== yamllint =="
      # Config in .yamllint; intentionally lenient about line length and strict about the
      # things that silently change MEANING in YAML — duplicate keys and tab indentation.
      yamllint .

      echo "== render every sync root =="
      # Rendering is this repo's equivalent of "does it compile". It resolves every overlay,
      # patch and remote base WITHOUT touching a cluster, and catches the missing resource or
      # mistyped patch target that would otherwise surface mid-reconcile, with the cluster
      # already half-changed.
      #
      # `flux build` is preferred because it renders exactly what the controller would; plain
      # `kustomize build` is the fallback when the CLI is absent from the image.
      rendered=0
      for root in clusters/*/; do
        [ -d "${root}" ] || continue
        echo "-- ${root}"
        if command -v flux >/dev/null 2>&1; then
          flux build kustomization "$(basename "${root}")" --path "${root}" --dry-run
        elif command -v kustomize >/dev/null 2>&1; then
          kustomize build "${root}" >/dev/null
        else
          echo "ERROR: neither flux nor kustomize is available in ${IAC_BUNDLE_IMAGE}"
          echo "ERROR: the tree cannot be rendered, so this job would pass without checking anything"
          exit 1
        fi
        rendered=$((rendered + 1))
      done

      if [ "${rendered}" -eq 0 ]; then
        # rules:exists matched, yet nothing rendered — the layout disagrees with what this job
        # looks for. Failing loudly beats a green job that verified nothing.
        echo "ERROR: no sync root rendered under clusters/ — check the layout against README.md"
        exit 1
      fi

      echo "OK: ${rendered} sync root(s) render cleanly. Nothing was applied — the reconciler does that."

# ---------------------------------------------------------------------------------------
# Validate the raw Kubernetes manifests
# ---------------------------------------------------------------------------------------
validate_manifests:
  stage: validate
  extends:
    - .default_runner_infra
  image:
    name: "${IAC_BUNDLE_IMAGE}"
  rules:
    - if: $NO_LINT_CHECKS == "true"
      when: never
    - exists:
        - manifests/**/*.yaml
      when: always
  script:
    - |
      set -euo pipefail

      # kubeconform validates against the real Kubernetes JSON schemas OFFLINE — no
      # kubeconfig, no cluster, no credentials in this pipeline (which is the whole point).
      # `kubectl apply --dry-run=client` is NOT an acceptable substitute: modern kubectl
      # fetches the OpenAPI schema from an API server, so it needs a live cluster and a
      # credential to do what kubeconform does from a schema bundle.
      if command -v kubeconform >/dev/null 2>&1; then
        echo "== kubeconform =="
        # -strict rejects unknown fields (a typo'd key is otherwise accepted and silently
        # ignored by the API server); -ignore-missing-schemas lets CRDs through, since their
        # schemas live in the cluster they install into.
        kubeconform -strict -summary -ignore-missing-schemas manifests/
      else
        echo "WARN: kubeconform not available in ${IAC_BUNDLE_IMAGE} — falling back to a structural check"
        # A deliberately small fallback rather than a skip: an unparseable or nameless
        # manifest must never reach the cluster. Add kubeconform to the bundle image to
        # upgrade this to real schema validation.
        python3 - <<'PY'
      import pathlib
      import sys

      import yaml

      failures = []
      for path in sorted(pathlib.Path("manifests").rglob("*.yaml")):
          try:
              docs = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
          except yaml.YAMLError as exc:
              failures.append(f"{path}: not valid YAML: {exc}")
              continue
          for i, doc in enumerate(d for d in docs if d is not None):
              missing = [k for k in ("apiVersion", "kind") if k not in doc]
              if missing:
                  failures.append(f"{path}[{i}]: missing {', '.join(missing)}")
              elif not (doc.get("metadata") or {}).get("name"):
                  failures.append(f"{path}[{i}]: {doc['kind']} has no metadata.name")

      for failure in failures:
          print(f"ERROR: {failure}")
      print(f"checked manifests/ — {len(failures)} problem(s)")
      sys.exit(1 if failures else 0)
      PY
      fi

      echo "OK: manifests are well-formed. Nothing was applied."

# =========================================================================================
# Repo-local gates — they check the repo, not the cluster.
#
# Both jobs enforce a rule the generated CLAUDE.md states as MECHANICALLY ENFORCED ("Doc-sync
# is enforced", "Standard-drift is enforced"). Like the two jobs above they are local by
# nature rather than by convenience:
#
#   * they validate THIS repository's own files — the CLAUDE.md generated here, this repo's
#     own docs — so there is no shared logic to donate upstream. A template job would need
#     every path and file name passed in as a variable before it could say anything at all,
#     and a "shared" job configured entirely per-repo is a copy with extra steps.
#   * they need nothing but bash, coreutils and git, so the usual reasons to centralise
#     (pinned tool images, registry credentials, cache tuning) do not apply.
#   * a rule advertised as enforced while nothing runs it is worse than no rule: it teaches
#     every reader that the standard is advisory, and the next rule is believed even less.
#
# They hold no cluster credential and apply nothing, so they do not weaken the guarantee at
# the top of this file. If a second repo ever needs them VERBATIM, that is the signal to move
# them into @@CI_TEMPLATES_PROJECT@@ unchanged — not to grow more local jobs here.
# =========================================================================================

# Standard-drift guard (CLAUDE.md "Standard-drift is enforced").
#
# CLAUDE.md is GENERATED by ./standard/compose.sh from standard/base.md +
# standard/profiles/infra.md + standard/repo.env. It drifts two ways: someone edits the
# generated file (the edit dies at the next regenerate and never reaches the other repos), or
# someone edits the sources and forgets to regenerate (every agent then reads the OLD
# rulebook). Either way the group runs two standards and neither is authoritative — and in
# this repo the rulebook is what stands between an agent and a destructive command.
#
# `standard/` is VENDORED, not referenced: compose.sh, base.md and profiles/ are copied in
# when this scaffold is instantiated, and only repo.env is filled in per repo. A missing
# ./standard/compose.sh means the repo was created by copying files by hand rather than from
# the template — fix the copy, do not delete this job.
standard-drift:
  stage: validate
  # Same bundle image the lint jobs above already pull, so this adds no new pin to maintain.
  # Nothing is installed at job time and nothing is fetched: the gate is pure bash +
  # coreutils and works with no network — it cannot go red because a registry is down.
  image:
    name: "${IAC_BUNDLE_IMAGE}"
    entrypoint: [""]
  # `.default_runner`, not `.default_runner_infra`: this gate reads files, it does not touch
  # the cluster or need the infra fleet's network. Both anchors are overridden to the same
  # literal tag above, so today the choice is about intent — and it stays correct if the two
  # fleets are ever split.
  extends:
    - .default_runner
  # Independent of every other job — report the drift in the first seconds of the pipeline,
  # not after the render.
  needs: []
  rules:
    # Deliberately NOT gated on $NO_LINT_CHECKS like the jobs above: that switch exists to get
    # an urgent cluster fix through a linter that is wrong, and it must not also silence the
    # rulebook check, which cannot be "wrong about a cluster" at all.
    #
    # No branch pipeline while an MR is open for that branch: the MR pipeline covers the same
    # commit, and without this guard every push runs the gate twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH
      when: always
  script:
    - |
      set -u
      # compose.sh --check prints the full diff (committed vs regenerated) before it exits,
      # so the fix is readable straight from the job log.
      rc=0
      ./standard/compose.sh --check || rc=$?
      case "$rc" in
        0) ;;
        2)
          echo "ERROR: CLAUDE.md has drifted from standard/ (diff above)."
          echo "ERROR: Edit standard/base.md or standard/profiles/<profile>.md — never CLAUDE.md"
          echo "ERROR: itself — then run ./standard/compose.sh and commit the regenerated file."
          exit 1
          ;;
        *)
          echo "ERROR: compose.sh could not run (exit ${rc}). This is a configuration error,"
          echo "ERROR: not drift: standard/repo.env is missing, incomplete, or names a profile"
          echo "ERROR: that has no standard/profiles/<profile>.md."
          exit 1
          ;;
      esac

# Doc-sync guard (CLAUDE.md "Documentation sync" rule).
#
# Fails an MR that changes the GitOps tree or the manifests without touching any
# documentation. This catches the common failure mode where an agent changes what the cluster
# runs but forgets the runbook/CHANGELOG/contracts. Agent-agnostic — it works no matter which
# tool wrote the diff.
#
# In this repo the documentation IS the recovery path: merging is the apply, so the only
# record of why a component is configured the way it is, and of how to bring it back, is what
# the MR wrote down. A green pipeline over an undocumented cluster change is exactly the state
# docs/runbook.md exists to prevent.
#
# Escape hatch: label the MR "no-docs", or put "[skip doc-sync]" in the MR title, for the rare
# change that genuinely needs no doc update.
#
# This repo supports exactly ONE CI host. If you ever add a GitHub pipeline alongside this
# one, it needs both gates with the SAME patterns and the SAME escape hatches — otherwise the
# identical change passes on one host and fails on the other, and people learn to re-run the
# red one until it turns green.
doc-sync:
  stage: validate
  image:
    name: "${IAC_BUNDLE_IMAGE}"
    entrypoint: [""]
  extends:
    - .default_runner
  needs: []
  variables:
    # The diff base is an ordinary commit in the target branch's history, which a shallow
    # clone does not contain — with the default depth `git diff` fails with "bad object".
    GIT_DEPTH: "0"
  rules:
    # MR-scoped by construction: "did this change touch docs" is only a meaningful question
    # against a review target. On a branch push there is nothing to diff against.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - |
      set -u
      case "${CI_MERGE_REQUEST_TITLE:-}" in
        *"[skip doc-sync]"*) echo "skip via title"; exit 0 ;;
      esac
      # CI_MERGE_REQUEST_LABELS is comma-separated; spaces are stripped so " no-docs" from a
      # hand-typed label list still matches. "dependencies" is the label Renovate is
      # configured to add — a pinned-version bump legitimately carries no doc change. There is
      # no actor check: the Renovate bot's username is per-installation, so the label is the
      # only portable hook.
      labels=",$(printf '%s' "${CI_MERGE_REQUEST_LABELS:-}" | tr -d ' '),"
      case "$labels" in
        *",no-docs,"* | *",dependencies,"*) echo "skip via label"; exit 0 ;;
      esac

      # GitLab hands MR pipelines the merge base as CI_MERGE_REQUEST_DIFF_BASE_SHA. The
      # fallback exists only for the case where it is absent (an older GitLab, or a pipeline
      # shape that does not populate it) — recomputing it by hand when GitLab already knows it
      # is how two checks end up disagreeing about what "changed" means.
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}"
      if [ -z "$base" ]; then
        target="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:?no MR target branch}"
        git fetch --quiet origin "$target"
        base="$(git merge-base FETCH_HEAD HEAD)"
      fi

      changed="$(git diff --name-only "$base" HEAD)"
      echo "changed files:"; echo "$changed"

      # Code side, adapted to a repo whose "code" is applied configuration. There is no src/
      # here; the four GitOps directories plus manifests/ are what ends up running in the
      # cluster, and scripts/ is what humans and the monthly audit execute. Patterns are
      # anchored (^) so a path only counts at the repo root.
      #
      # This is the widest of the three profiles on purpose: a change here has no artifact and
      # no version to inspect afterwards, so if the MR does not say what it did, nothing else
      # ever will.
      code="$(echo "$changed" | grep -E '^(clusters/|apps/|repositories/|manifests/|scripts/|auto-tests/|standard/|skills/|\.github/workflows/|\.gitlab-ci\.yml)' || true)"
      # Doc side includes docs/runbook.md and docs/contracts.md via `docs/`, and
      # AUTOPILOT-LOG.md, which CLAUDE.md makes mandatory for an autonomous change of any
      # substance.
      docs="$(echo "$changed" | grep -E '^(docs/|README\.md|CHANGELOG\.md|TODO\.md|CLAUDE\.md|AUTOPILOT-LOG\.md)' || true)"

      if [ -n "$code" ] && [ -z "$docs" ]; then
        echo "ERROR: Cluster configuration changed but no docs were updated. Update the matching"
        echo "ERROR: doc per CLAUDE.md 'Documentation sync' (CHANGELOG/docs/runbook.md/contracts/"
        echo "ERROR: TODO), or add the 'no-docs' label / '[skip doc-sync]' in the MR title if"
        echo "ERROR: truly N/A."
        exit 1
      fi
      echo "doc-sync OK"
