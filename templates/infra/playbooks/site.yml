---
# Entry-point playbook for @@PROJECT@@ — the substrate everything else assumes.
#
# THE TWO PROPERTIES EVERY TASK ADDED HERE MUST HAVE:
#
#   * Idempotent. Running this twice must change nothing the second time. Every run is a
#     reconciliation, never a one-shot script whose effect depends on what happened before.
#     Concretely: use modules rather than `command`/`shell`; where a shell is unavoidable,
#     give it a `creates:`/`removes:` guard or a `changed_when:` that tells the truth.
#   * Reproducible from zero. This must be able to build the substrate on a fresh machine. A
#     step that only works because of undocumented existing state is a defect — write it
#     down in docs/runbook.md or automate it here.
#
# CI never runs this. It only proves the file parses (`--syntax-check`) and lints. A human
# runs `--check --diff` first, reads the plan, and only then applies — see docs/runbook.md.
- name: Provision cluster prerequisites
  hosts: cluster
  become: true
  gather_facts: true

  pre_tasks:
    # Fail before touching anything rather than half-way through. A play that aborts at task
    # 12 of 30 leaves a machine in a state that is neither the old one nor the new one, and
    # that state is what the next person has to reason about.
    - name: Assert that the required variables are defined
      ansible.builtin.assert:
        that:
          - kubernetes_version is defined
          - cluster_name is defined
        fail_msg: >-
          Missing required variables. They come from inventories/<env>/group_vars/ —
          see docs/configuration.md for where each value originates.
        quiet: true

    # Every version is exact. `latest` in an infra repo is an outage waiting for a quiet
    # week: the run that installed it succeeded, and the identical run three weeks later
    # installs something else.
    - name: Assert that no version variable is floating
      ansible.builtin.assert:
        that:
          - kubernetes_version is not search('latest')
        fail_msg: "Pin an exact version — 'latest' makes the run unreproducible."
        quiet: true

  tasks:
    - name: Report the target that would be provisioned
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} -> cluster {{ cluster_name }},
          kubernetes {{ kubernetes_version }}

    # Real work goes here as ROLES, not as a growing list of tasks: a role is the unit that
    # can be tested, reused across environments and pinned. Add each role to
    # roles/requirements.yml (with an exact version) and invoke it below.
    #
    # - name: Install the container runtime
    #   ansible.builtin.include_role:
    #     name: containerd
    #
    # - name: Bootstrap the cluster
    #   ansible.builtin.include_role:
    #     name: k3s
