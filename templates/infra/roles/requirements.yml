---
# Ansible ROLES this repo depends on. Installed with:
#   ansible-galaxy role install -r roles/requirements.yml -p roles/
#
# EXACT VERSIONS, ALWAYS. A role is executed code from someone else's repository running as
# root on our machines; a floating version means the run that provisioned the cluster and the
# run that "just re-applies the same thing" are two different programs. `latest` here is the
# single easiest way to turn a quiet Tuesday into an outage.
#
# Downloaded roles are git-ignored rather than vendored: this file is the reviewable form of
# the dependency, and a diff of 4 000 vendored lines is not reviewed by anyone.
roles: []
# - name: containerd
#   src: https://github.com/example/ansible-role-containerd
#   version: 1.4.2      # a tag or a full commit SHA — never a branch
