# CI — the single release pipeline (see CLAUDE.md § Build, artifacts & CI).
#
#   lint-test  — ruff, mypy, pytest (3.11 & 3.12)
#   quality    — radon/xenon code-quality (complexity + maintainability)
#   security   — bandit, pip-audit, semgrep (SAST, isolated via pipx)
#   checkov / hadolint / trivy-config — IaC/config scans (separate named checks)
#   version    — compute the SemVer with GitVersion (single source, shared with docs/chart)
#   image      — build the Docker image, trivy-scan it, push to GHCR (dev/rc/release + tags)
#   chart      — helm lint/template, package + push the OCI chart to GHCR (tags)
#   functional — boot the built image and verify GET /health
#   build      — Python sdist/wheel on a version tag (publish to PyPI is a later step)
#
# The image/chart names are derived from the repo name — no edit needed when you adopt
# the template. Newly-added scanners run in report mode (soft-fail) at first.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  version:
    name: Version (GitVersion)
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gv.outputs.semVer }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "6.x"
      - id: gv
        uses: gittools/actions/gitversion/execute@v3

  lint-test:
    name: Lint & test
    # Language-specific: runs only for a Python project. On other languages this skips
    # (add your language's lint/type/test job alongside). The agnostic gates below
    # (checkov/hadolint/trivy/image/chart/functional) run regardless.
    if: ${{ hashFiles('pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (type-check)
        run: mypy
      - name: Pytest
        run: pytest

  quality:
    name: Code quality (radon/xenon)
    if: ${{ hashFiles('pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install radon xenon
      - name: Complexity + maintainability (report)
        run: |
          radon cc -s -a src
          radon mi -s src
      - name: Complexity gate (xenon)
        continue-on-error: true
        run: xenon --max-absolute C --max-modules B --max-average A src

  security:
    name: Security (bandit/pip-audit/semgrep)
    if: ${{ hashFiles('pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (project + bandit only, keep pip-audit env clean)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install bandit pip-audit
      - name: Bandit
        run: bandit -c pyproject.toml -r src
      - name: pip-audit (project env)
        run: pip-audit
      - name: Semgrep (SAST, isolated via pipx)
        continue-on-error: true
        run: pipx run semgrep scan --config p/python --config p/security-audit --error --skip-unknown-extensions

  checkov:
    name: Checkov (IaC misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - continue-on-error: true
        run: |
          pip install checkov
          checkov -d . --framework dockerfile,github_actions,secrets --soft-fail --quiet

  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -i hadolint/hadolint:latest hadolint - < Dockerfile || true

  trivy-config:
    name: Trivy (config misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - continue-on-error: true
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/trivy" config . --exit-code 0

  image:
    name: Docker image → GHCR
    runs-on: ubuntu-latest
    # Language-agnostic (builds the Dockerfile). Not gated on lint-test so it still runs for
    # non-Python projects; the overall pipeline still fails if the language jobs fail.
    needs: [version]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Primary tag = the GitVersion SemVer; plus branch/pr/sha; :latest only on release.
          tags: |
            type=raw,value=${{ needs.version.outputs.semver }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/release' }}
      - name: Build (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Trivy (image vulnerabilities, report)
        continue-on-error: true
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/trivy" image --exit-code 0 --ignore-unfixed "${IMAGE}:${{ steps.meta.outputs.version }}"
      - name: Push to GHCR (dev/rc/release + tags)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/rc' || github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          while read -r t; do [ -n "$t" ] && docker push "$t"; done <<< "${{ steps.meta.outputs.tags }}"

  chart:
    name: Helm chart → GHCR
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint & template
        run: |
          helm lint chart
          helm template t chart > /dev/null
      - name: Package (version from GitVersion)
        run: |
          helm package chart \
            --version "${{ needs.version.outputs.semver }}" \
            --app-version "${{ needs.version.outputs.semver }}" \
            --destination /tmp/chart
      - name: Push OCI chart (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push /tmp/chart/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

  functional:
    name: Functional (HTTP /health)
    runs-on: ubuntu-latest
    # A minimal env comes from the GitHub Actions environment (variables/secrets).
    environment: ci-functional
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: DOCKER_BUILDKIT=1 docker build -t app:ci .
      - name: Boot the service and probe /health
        env:
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
        run: |
          docker run -d --name app -p 8080:8080 -e APP_PORT=8080 app:ci
          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS localhost:8080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs app | tail -15 || true
          docker rm -f app >/dev/null 2>&1 || true
          test "$ok" = "1"

  build:
    name: Build distribution (on tag)
    runs-on: ubuntu-latest
    needs: [lint-test, security]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
