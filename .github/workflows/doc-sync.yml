# Doc-sync guard (CLAUDE.md "Documentation sync" rule, mechanically enforced).
#
# Fails a PR that changes code/deploy surface without touching any documentation.
# This catches the common failure mode where an agent updates code but forgets the
# docs/CHANGELOG/tests. Agent-agnostic — it works no matter which tool wrote the diff.
#
# Escape hatch: add the label "no-docs" to the PR, or put "[skip doc-sync]" in the PR
# title, for the rare change that genuinely needs no doc update.
name: doc-sync

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: Docs updated with code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check code changes carry doc changes
        env:
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          case "$TITLE" in *"[skip doc-sync]"*) echo "skip via title"; exit 0;; esac
          # Dependency bumps (Dependabot) legitimately carry no doc change.
          case ",$LABELS," in *",no-docs,"* | *",dependencies,"*) echo "skip via label"; exit 0;; esac
          case "$ACTOR" in dependabot | "dependabot[bot]") echo "skip: dependabot"; exit 0;; esac

          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "changed files:"; echo "$changed"

          # Code side = everything a reader of the docs could be misled about. `standard/`
          # is in it because the standard IS the product here: a PR that rewrites the rules
          # and leaves CLAUDE.md/CHANGELOG untouched used to sail through this gate. The
          # patterns are ANCHORED (^), so templates/infra/README.md counts as code — it is a
          # file this repo ships to other repos, not documentation of this repo.
          code=$(echo "$changed" | grep -E '^(src/|chart/|helm/|deploy/|standard/|skills/|templates/|auto-tests/|Dockerfile|docker-compose|\.github/workflows/|\.gitlab-ci\.yml)' || true)
          # Doc side includes AUTOPILOT-LOG.md: CLAUDE.md makes it mandatory for an
          # autonomous change of any substance, so it is a legitimate doc for this gate.
          docs=$(echo "$changed" | grep -E '^(docs/|README\.md|CHANGELOG\.md|TODO\.md|CLAUDE\.md|AUTOPILOT-LOG\.md)' || true)

          if [ -n "$code" ] && [ -z "$docs" ]; then
            echo "::error::Code/deploy files changed but no docs updated. Update the matching"
            echo "::error::doc per CLAUDE.md 'Documentation sync' (CHANGELOG/docs/tests.md/Features/TODO),"
            echo "::error::or add the 'no-docs' label / '[skip doc-sync]' in the PR title if truly N/A."
            exit 1
          fi
          echo "doc-sync OK"
