# Release — vendored, canonical for the standard.
#
# NO TAGS. A merge into the `release` branch IS the release: this runs on push to
# `release`, computes the version with GitVersion (the single source — see
# GitVersion.yml `next-version`), injects it into the build, and publishes to PyPI
# via Trusted Publishing (OIDC, no stored token).
#
# Why vendored (not the reusable open-ci-actions release workflow): PyPI verifies the
# OIDC `job_workflow_ref`, which for a reusable-workflow call points at
# open-ci-actions, not this repo -> `invalid-publisher` (pypi/warehouse#11096). A
# self-contained workflow in the consumer repo is the supported pattern.
#
# ONE-TIME PyPI SETUP (before the first publish): on PyPI add a Trusted Publisher for
# the project, bound to owner/repo = THIS repo, workflow = `release.yml`,
# environment = `pypi`. To cut a new version: bump `next-version` in GitVersion.yml,
# then merge dev -> rc -> release.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC identity for PyPI Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GitVersion needs full history
      - id: gitversion
        uses: korkin25/open-ci-actions/actions/gitversion@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inject the GitVersion number into the package
        run: |
          python -m pip install --upgrade pip hatch build
          hatch version "${{ steps.gitversion.outputs.semver }}"
          echo "Publishing version ${{ steps.gitversion.outputs.semver }}"
      - name: Build sdist + wheel
        run: python -m build
      - name: Check distribution metadata
        run: pipx run twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
