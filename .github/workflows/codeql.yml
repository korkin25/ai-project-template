# CodeQL — GitHub's native SAST (complements semgrep/bandit). Results appear under the
# repository's Security → Code scanning tab. Free for public repos.
name: CodeQL

on:
  push:
    branches: ["dev", "rc", "release"]
  pull_request:
    branches: ["dev", "rc", "release"]
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (python)
    # Language-specific: skips when there's no Python project. For another language, set
    # `languages` below (and adjust this guard) — CodeQL supports go, java, js/ts, c/c++, etc.
    if: ${{ hashFiles('pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
