# Standard-drift guard (CLAUDE.md "Standard-drift is enforced", mechanically enforced).
#
# CLAUDE.md is GENERATED by ./standard/compose.sh from standard/base.md +
# standard/profiles/<profile>.md + standard/repo.env. Two failure modes make it drift:
# someone edits the generated file directly (the edit is erased on the next regenerate,
# and never reaches the other repos), or someone edits the sources and forgets to
# regenerate (the rulebook every agent actually reads is then the OLD one). Either way
# the group is running two different standards and neither is authoritative.
#
# This job regenerates in memory and diffs. compose.sh exits 2 on drift and prints the
# full diff, so the fix is visible in the log without re-running anything locally.
#
# Why its OWN workflow rather than a job in ci.yml: ci.yml is a pure composition of the
# reusable workflows in korkin25/open-ci-actions ("new shared jobs belong in
# open-ci-actions, not here"), and this check is repo-local by nature — it validates a
# file generated inside THIS repo and has no shared logic to donate upstream. Bespoke
# local gates get their own file here; doc-sync.yml is the same shape.
name: standard-drift

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: CLAUDE.md matches standard/
    runs-on: ubuntu-latest
    steps:
      # Shallow checkout is enough: the gate reads the working tree, never the history.
      - uses: actions/checkout@v4
      - name: Regenerate CLAUDE.md from standard/ and diff
        run: |
          set -uo pipefail
          # bash + coreutils only. No toolchain to install and no network call, so this
          # gate cannot go red because of a registry outage or a fork's missing secrets.
          rc=0
          ./standard/compose.sh --check || rc=$?
          case "$rc" in
            0) exit 0 ;;
            2)
              echo "::error::CLAUDE.md has drifted from standard/ (diff above)."
              echo "::error::Edit standard/base.md or standard/profiles/<profile>.md — never"
              echo "::error::CLAUDE.md itself — then run ./standard/compose.sh and commit the result."
              exit 1
              ;;
            *)
              echo "::error::compose.sh could not run (exit $rc). This is a configuration"
              echo "::error::error, not drift: standard/repo.env is missing, incomplete or"
              echo "::error::names a profile that has no standard/profiles/<profile>.md."
              exit 1
              ;;
          esac
